---
- name: Remove node_exporter
  ansible.builtin.include_tasks: ../../../tasks/remove-systemd-service.yml
  vars:
    svc_unit: node_exporter
    svc_user: "{{ node_exporter_user }}"
    svc_group: "{{ node_exporter_group }}"
    svc_paths:
      - "{{ node_exporter_launcher }}"
      - "{{ node_exporter_binary }}"
      - "{{ node_exporter_unpack_dir }}"
      - "{{ node_exporter_archive_path }}"
      - "{{ node_exporter_textfile_dir | dirname }}"
