---
- name: Remove the default site that the nginx.org package ships
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent

- name: Keep 14 days of NGINX logs
  ansible.builtin.copy:
    dest: /etc/logrotate.d/nginx
    owner: root
    group: root
    mode: "0644"
    content: |
      /var/log/nginx/*.log {
          daily
          missingok
          rotate 14
          compress
          delaycompress
          notifempty
          create 0640 www-data adm
          sharedscripts
          postrotate
              if [ -f /run/nginx.pid ]; then
                  kill -USR1 `cat /run/nginx.pid`
              fi
          endscript
      }
