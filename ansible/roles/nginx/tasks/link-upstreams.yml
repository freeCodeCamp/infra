---
- name: Find the tracked upstreams
  stat:
    path: /etc/nginx/snippets/upstreams/{{ pxy_env }}.conf
  register: tracked_upstreams

- name: Check the tracked upstreams are on the host
  assert:
    that: tracked_upstreams.stat.exists
    fail_msg: >-
      /etc/nginx/snippets/upstreams/{{ pxy_env }}.conf is missing, so the link
      would dangle and leave this host with no upstreams. Push the nginx-config
      commit that adds it, then run this playbook again.

- name: Link the upstreams to the tracked config
  file:
    src: /etc/nginx/snippets/upstreams/{{ pxy_env }}.conf
    dest: /etc/nginx/configs/upstreams.conf
    state: link
    force: true
