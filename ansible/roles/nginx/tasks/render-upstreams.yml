---
- name: Decrypt the upstream list once for this host
  ansible.builtin.set_fact:
    nginx_upstreams_to_render: "{{ nginx_upstreams }}"
  no_log: true

- name: Read the upstreams on the host
  ansible.builtin.slurp:
    path: "{{ nginx_upstreams_path }}"
  register: nginx_upstreams_on_host

- name: Check every listed upstream block exists on the host
  ansible.builtin.assert:
    that: (nginx_upstreams_on_host.content | b64decode) is regex('^upstream ' ~ (item.name | regex_escape) ~ ' \{', multiline=true)
    fail_msg: "upstream {{ item.name }} is not in {{ nginx_upstreams_path }} on {{ inventory_hostname }}"
  loop: "{{ nginx_upstreams_to_render }}"
  loop_control:
    label: "{{ item.name }}"

- name: Write the listed upstream blocks
  ansible.builtin.replace:
    path: "{{ nginx_upstreams_path }}"
    regexp: "^upstream {{ item.name | regex_escape }} \\{[^}]*\\}"
    replace: |-
      upstream {{ item.name }} {
      {% if item.least_conn | default(false) %}  least_conn;
      {% endif %}{% for server in item.servers %}  server {{ server }};
      {% endfor %}}
  loop: "{{ nginx_upstreams_to_render }}"
  loop_control:
    label: "{{ item.name }}"
  register: nginx_upstreams_written
