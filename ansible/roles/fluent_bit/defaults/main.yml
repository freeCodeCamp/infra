---
fluent_bit_version: "5.1.5"
fluent_bit_binary: /opt/fluent-bit/bin/fluent-bit
fluent_bit_config: /etc/fluent-bit/fluent-bit.yaml
fluent_bit_state_dir: /var/lib/fluent-bit

fluent_bit_vlagent_host: ""
fluent_bit_vmauth_port: 30427
fluent_bit_sender_token: ""
fluent_bit_http_port: 2020
fluent_bit_ip_allow: [localhost]

fluent_bit_env: "{{ inventory_hostname.split('-') | first }}"
fluent_bit_role: "{{ inventory_hostname | regex_replace('^[a-z0-9]+-vm-', '') | regex_replace('-[0-9]+$', '') }}"

fluent_bit_limit_journal: 1G
fluent_bit_limit_nginx_access: 4G
fluent_bit_limit_nginx_error: 256M
fluent_bit_limit_docker: 1G

fluent_bit_push_metrics: true
fluent_bit_vpc_cidr: ""
fluent_bit_node_exporter_port: 9100
fluent_bit_metrics_interval: 60s
fluent_bit_limit_metrics: 256M
fluent_bit_provider: vultr
fluent_bit_region: ewr
fluent_bit_metrics_role: "{{ 'clt' if fluent_bit_role.startswith('clt-') else fluent_bit_role }}"
fluent_bit_metrics_language: "{{ fluent_bit_role | regex_replace('^clt-', '') if fluent_bit_role.startswith('clt-') else '' }}"
