---
- name: Check the receiver inputs
  ansible.builtin.import_tasks: preflight.yml

- name: Find the VPC address that the node exporter listens on
  when: fluent_bit_push_metrics | bool and fluent_bit_vlagent_host | length > 0
  block:
    - name: Read the VPC address of this host
      ansible.builtin.command: ip -o -4 addr show to {{ fluent_bit_vpc_cidr }}
      register: fluent_bit_vpc_addr
      changed_when: false
      check_mode: false

    - name: Refuse a host without exactly one VPC address
      ansible.builtin.assert:
        that:
          - fluent_bit_vpc_cidr | length > 0
          - fluent_bit_vpc_addr.stdout_lines | length == 1
        fail_msg: "{{ inventory_hostname }}: {{ fluent_bit_vpc_addr.stdout_lines }}"

    - name: Keep the VPC address
      ansible.builtin.set_fact:
        fluent_bit_vpc_ip: "{{ (fluent_bit_vpc_addr.stdout.split()[3]).split('/') | first }}"

- name: Add the Fluent Bit apt repository
  ansible.builtin.deb822_repository:
    name: fluent-bit
    types: deb
    uris: "https://packages.fluentbit.io/ubuntu/{{ ansible_facts['distribution_release'] }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    architectures: amd64
    signed_by: https://packages.fluentbit.io/fluentbit.key
    install_python_debian: true
    state: present
  register: fluent_bit_repo

- name: Read the installed packages
  ansible.builtin.package_facts:
    manager: apt

- name: Install the pinned Fluent Bit
  ansible.builtin.apt:
    name: "fluent-bit={{ fluent_bit_version }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ fluent_bit_apt_cache_valid_time if fluent_bit_installed == fluent_bit_version and fluent_bit_repo is not changed else 0 }}"
  vars:
    fluent_bit_installed: "{{ (ansible_facts.packages['fluent-bit'] | default([{}]) | first).version | default('') }}"
    allow_downgrade: true
    allow_change_held_packages: true

- name: Hold the Fluent Bit package
  ansible.builtin.dpkg_selections:
    name: fluent-bit
    selection: hold

- name: Create the Fluent Bit storage directory
  ansible.builtin.file:
    path: "{{ fluent_bit_state_dir }}/storage"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Install the Fluent Bit config
  ansible.builtin.template:
    src: fluent-bit.yaml.j2
    dest: "{{ fluent_bit_config }}"
    owner: root
    group: root
    mode: "0640"
    validate: "{{ fluent_bit_binary }} -c %s --dry-run"
  diff: false
  when: fluent_bit_vlagent_host | length > 0
  notify: Restart fluent-bit

- name: Create the Fluent Bit unit drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/fluent-bit.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Run Fluent Bit with the YAML config
  ansible.builtin.template:
    src: override.conf.j2
    dest: /etc/systemd/system/fluent-bit.service.d/10-yaml.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart fluent-bit

- name: Run Fluent Bit only when it has a receiver
  ansible.builtin.systemd:
    name: fluent-bit
    enabled: "{{ fluent_bit_vlagent_host | length > 0 }}"
    state: "{{ 'started' if fluent_bit_vlagent_host | length > 0 else 'stopped' }}"
    daemon_reload: true
