---
# Usage:
#   ansible-playbook -i inventory/linode.yml play-any--update.yml \
#     -e variable_host=stg_oldeworld_clt

- name: Update virtual machines
  hosts: "{{ variable_host | default('null') }}"
  serial: "{{ variable_serial | default(1) }}"
  max_fail_percentage: 0
  gather_facts: false
  become: true
  become_user: root
  tasks:
    - name: Wait for connection
      ansible.builtin.wait_for_connection:
        connect_timeout: 60
        sleep: 5
        timeout: 300

    - name: Update apt repo and cache
      block:
        - name: Update apt cache
          ansible.builtin.apt:
            update_cache: true
            force_apt_get: true
            cache_valid_time: 3600
            update_cache_retries: 10
            update_cache_retry_max_delay: 30
      rescue:
        - name: Clean apt cache and retry
          ansible.builtin.shell: apt-get clean && apt-get update
          retries: 3
          delay: 10

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        force_apt_get: true

    - name: Autoclean old packages
      ansible.builtin.apt:
        autoclean: true
        force_apt_get: true

    - name: Autoremove unused packages
      ansible.builtin.apt:
        autoremove: true
        force_apt_get: true
