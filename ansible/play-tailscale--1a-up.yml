---
# Usage:
#   ansible-playbook -i inventory/linode.yml play-tailscale--1a-up.yml \
#     -e variable_host=<group>
#
# The device is tagged at enrolment. Override the default tag list with
#   -e variable_tags=tag:added-by-ops,tag:<extra>
# Repeat the same -e variable_tags on every re-run of a host that carries more
# than the default tag; tailscale up keeps no flags between runs.
- name: Tailscale - Connect to Tailscale Network
  hosts: '{{ variable_host | default("null") }}'
  become: true
  gather_facts: false
  tasks:
    - name: Check if Tailscale is Installed
      shell:
        cmd: |
          tailscale --version
        executable: /bin/bash
      register: tailscale_version

    - name: Add Tailscale to Network
      shell:
        cmd: |
          tailscale up \
          --authkey "{{ lookup('env', 'TAILSCALE_AUTH_KEY') }}" \
          --hostname {{ inventory_hostname }} \
          --advertise-tags "{{ variable_tags | default('tag:added-by-ops') }}" \
          --force-reauth \
          --reset
        executable: /bin/bash
      no_log: true
      changed_when: true
      ignore_errors: true
      register: tailscale_up

    - name: Print error message if Tailscale failed
      debug:
        msg: '{{ tailscale_up.stderr }}'
      when: tailscale_up.rc != 0

    - name: Check if Tailscale is Connected
      shell:
        cmd: |
          tailscale status --json | jq -r '.Self.Online'
        executable: /bin/bash
      register: tailscale_status

    - name: Check DNS name
      shell:
        cmd: |
          tailscale status --json | jq -r '.Self.DNSName'
        executable: /bin/bash
      register: tailscale_dns

    - name: Print Tailscale Status
      debug:
        msg: |
          Tailscale Status: {{ tailscale_status.stdout }}
          Tailscale DNS: {{ tailscale_dns.stdout }}
