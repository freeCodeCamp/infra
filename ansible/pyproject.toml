[project]
name = "freecodecamp-ansible"
version = "0.1.0"
description = "freeCodeCamp.org infrastructure ansible configuration"
requires-python = ">=3.12"
dependencies = [
  "ansible-core>=2.21,<2.22",
  "ansible-specdoc>=0.0.19",
  "boto3>=1.39.7",
  "botocore>=1.39.7",
  "docker>=7.1.0",
  "jsonpatch>=1.33",
  "kubernetes>=24.2.0",
  "linode-api4>=5.33.0",
  "polling>=0.3.2",
  "requests-oauthlib>=2.0.0",
]

[project.optional-dependencies]
dev = []

[dependency-groups]
dev = ["ansible-lint>=26.9.0", "types-requests>=2.32.4.20250611"]
