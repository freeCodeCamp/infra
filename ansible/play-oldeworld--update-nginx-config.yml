---
# Usage: ansible-playbook -i inventory/linode.yml play-oldeworld--update-nginx-config.yml -e variable_host=<group>
- name: Pull and check the NGINX config on every host
  hosts: '{{ variable_host | default("null") }}'
  gather_facts: false
  become: true

  tasks:
    - name: Pull, render and check the config
      block:
        - name: Update Git Repository
          ansible.builtin.git:
            repo: https://github.com/freeCodeCamp/nginx-config.git
            dest: "{{ nginx_config_dir }}"
            clone: false
            update: true
            force: true
            single_branch: true
            version: main
            accept_hostkey: true
          register: git_update

        - name: Write the listed upstream blocks
          ansible.builtin.include_tasks: roles/nginx/tasks/render-upstreams.yml

        - name: Check NGINX Config
          ansible.builtin.command:
            chdir: "{{ nginx_config_dir }}"
            cmd: nginx -t
          changed_when: false
          check_mode: false

      rescue:
        - name: Restore the previous config
          ansible.builtin.include_tasks: tasks/restore-nginx-config.yml

        - name: Stop the run before any reload
          ansible.builtin.fail:
            msg: >-
              The new NGINX config failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('') }}
              {{ ansible_failed_result.stderr | default('') }}
              No host was reloaded. {{ nginx_restore_summary }}

- name: Restore every host when one host failed
  hosts: '{{ variable_host | default("null") }}'
  gather_facts: false
  become: true
  vars:
    nginx_failed_hosts: "{{ ansible_play_hosts_all | difference(ansible_play_hosts) }}"

  tasks:
    - name: Restore this host and stop the run
      when: nginx_failed_hosts | length > 0
      block:
        - name: Restore the previous config
          ansible.builtin.include_tasks: tasks/restore-nginx-config.yml

        - name: Stop the run before any reload
          ansible.builtin.fail:
            msg: >-
              {{ nginx_failed_hosts | join(', ') }} failed, so no host was reloaded.
              {{ inventory_hostname }}: {{ nginx_restore_summary }}

- name: Reload NGINX one host at a time
  hosts: '{{ variable_host | default("null") }}'
  gather_facts: false
  become: true
  serial: 1
  max_fail_percentage: 0
  vars:
    nginx_reload_marker: /var/lib/nginx-config.reloaded

  tasks:
    - name: Start NGINX
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Read the commit of the last reload
      ansible.builtin.slurp:
        src: "{{ nginx_reload_marker }}"
      register: nginx_reloaded_commit
      failed_when: false

    - name: Reload NGINX
      ansible.builtin.service:
        name: nginx
        state: reloaded
      when: >-
        nginx_upstreams_written is changed
        or (nginx_reloaded_commit.content | default('') | b64decode | trim) != git_update.after

    - name: Check NGINX holds its listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ variable_nginx_port | default(80) }}"
        timeout: 30

    - name: Record the commit of this reload
      ansible.builtin.copy:
        content: "{{ git_update.after }}\n"
        dest: "{{ nginx_reload_marker }}"
        mode: "0644"
