---
- name: Reboot a machine and wait for it to come back
  hosts: "{{ variable_host | default('null') }}"
  serial: '{{ variable_serial | default(1) }}'
  gather_facts: true
  become: true
  become_user: root
  vars:
    # Set force_reboot to True to force a reboot — mind the quotes!
    force_reboot: '{{ variable_force_reboot | default(False) }}'
  tasks:
    - name: Check if /var/run/reboot-required exists
      register: reboot_required
      stat:
        path: /var/run/reboot-required
        get_checksum: false

    # Reboot for the following reasons:
    # 1. /var/run/reboot-required exists (e.g. kernel update)
    # 2. Uptime is greater than 7 days
    # 3. force_reboot is set to True
    - name: Display Status
      debug:
        msg:
          - 'Debug info:'
          - '  Force Reboot Flag: {{ force_reboot }}'
          - '  Reboot Required File Exists: {{ reboot_required.stat.exists }}'
          - '  Uptime: {{ ansible_facts.uptime_seconds/86400 }} days'

    - name: Set Should Reboot
      set_fact:
        should_reboot: >-
          {{ (force_reboot | bool) or
             (reboot_required.stat.exists) or
             (ansible_facts.uptime_seconds > 604800) }}
        reboot_reason: >-
          {%- set reasons = [] -%} {%- if force_reboot | bool -%}
            {%- set reasons = reasons + ['manual force reboot requested'] -%}
          {%- endif -%} {%- if reboot_required.stat.exists -%}
            {%- set reasons = reasons + ['kernel update or package requires
          reboot'] -%} {%- endif -%} {%- if ansible_facts.uptime_seconds >
          604800 -%}
            {%- set reasons = reasons + ['system uptime exceeds 7 days'] -%}
          {%- endif -%} {%- if reasons|length == 0 -%}
            No reboot needed
          {%- else -%}
            {{ reasons|join(', ') }}
          {%- endif -%}

    - name: Print Reboot Reason
      debug:
        msg:
          'Rebooting the machine: {{ inventory_hostname }} - Reason: {{
          reboot_reason }}'
      when: should_reboot

    # Pre-reboot config gate, for NGINX hosts only.
    #
    # A running nginx serves from the config it loaded at start, so a broken
    # config on disk is invisible until the next restart. Reboot that host and
    # nginx cannot come back -- no restart policy helps, because every attempt
    # fails on the same parse error. Hold the host back instead and say why.
    #
    # This never fails a host. Under serial: 1 a failure here would end the
    # play and cost every host behind it their reboot.
    # The systemd module rather than `systemctl is-enabled`: same answer, and
    # ansible-lint rejects the shell-out at the production profile.
    # failed_when: false because the module fail_json()s on a unit with a
    # LoadError, and on the 74 hosts with no NGINX at all it simply reports
    # LoadState=not-found.
    - name: Read the NGINX unit state on this host
      ansible.builtin.systemd:
        name: nginx
      register: reboot_nginx_unit
      changed_when: false
      failed_when: false
      when: should_reboot

    - name: Validate the NGINX config before rebooting
      ansible.builtin.command: nginx -t
      register: reboot_nginx_config
      changed_when: false
      failed_when: false
      when:
        - should_reboot
        - (reboot_nginx_unit.status | default({})).UnitFileState | default('') in
          ['enabled', 'enabled-runtime', 'static']

    - name: Hold the reboot back when the NGINX config is broken
      ansible.builtin.set_fact:
        should_reboot: false
        reboot_held_back: true
      when:
        - should_reboot
        - reboot_nginx_config.rc is defined
        - reboot_nginx_config.rc != 0

    # ::warning:: so this surfaces in the GitHub job summary. A -v debug line
    # is invisible on a green job, and a held-back host IS the run's most
    # interesting fact. The verify stage reports the same host again later
    # with config_ok: false.
    - name: Say why the reboot was held back
      ansible.builtin.debug:
        msg: >-
          ::warning::Reboot HELD BACK on {{ inventory_hostname }}: nginx -t
          failed, so a reboot would leave NGINX dead with nothing able to
          restart it. Fix the config, then reboot by hand.
      when: reboot_held_back | default(false)

    - name: Conditionally Reboot
      block:
        - name: Reboot machine
          ansible.builtin.reboot:
            connect_timeout: 60
            reboot_timeout: 600
            pre_reboot_delay: 5
            post_reboot_delay: 30
            test_command: uptime
            msg: 'Reboot initiated by Ansible'
          register: reboot_result
          ignore_unreachable: true

        - name: Wait for machine to become reachable again
          wait_for_connection:
            delay: 10
            timeout: 300

        - name: Gather facts after reboot
          setup:

      when: should_reboot
      ignore_errors: '{{ ansible_check_mode }}'
