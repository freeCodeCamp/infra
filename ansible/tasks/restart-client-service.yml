---
- name: "Restart PM2 client-{{ service_type }} service"
  ansible.builtin.shell: |
    {{ nvm_preamble }}
    pm2 restart client-{{ service_type }}
  args:
    executable: /bin/bash
    chdir: "{{ client_root | default('/home/freecodecamp/client') }}"
  when: not dry_run

- name: "Wait for the port of client-{{ service_type }}"
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ client_ports[service_type] }}"
    timeout: 60
  when: not dry_run
