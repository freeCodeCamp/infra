---
- name: Validate Tailscale connected
  ansible.builtin.assert:
    that:
      - ansible_tailscale0 is defined
      - ansible_tailscale0.ipv4 is defined
      - ansible_tailscale0.ipv4.address is defined
    fail_msg: >-
      Tailscale not connected.
      Run play-tailscale--0-install.yml then play-tailscale--1a-up.yml.
