---
- name: Read the kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: kubeconfig_raw
  no_log: true

- name: Ensure the cluster directory exists
  ansible.builtin.file:
    path: "{{ kubeconfig_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false

- name: Write the kubeconfig locally
  ansible.builtin.copy:
    content: >-
      {{ kubeconfig_raw.content | b64decode
         | replace('https://127.0.0.1:6443', 'https://' ~ kubeconfig_server ~ ':6443')
         | regex_replace('(\s+)(name|cluster|user|current-context): default',
                         '\1\2: ' ~ kubeconfig_context) }}
    dest: "{{ kubeconfig_dir }}/.kubeconfig.yaml"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
  diff: false
