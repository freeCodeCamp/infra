---
- name: Set the exporter port for this check
  ansible.builtin.set_fact:
    verify_ne_port: "{{ node_exporter_port | default(9100) }}"

- name: Read the Tailscale address of this host
  ansible.builtin.command: tailscale ip -4
  register: verify_ne_tailscale
  changed_when: false

- name: Record the address node_exporter must bind
  ansible.builtin.set_fact:
    verify_ne_address: "{{ verify_ne_tailscale.stdout_lines | first }}"

- name: Read the node_exporter unit state
  ansible.builtin.systemd:
    name: node_exporter
  register: verify_ne_unit
  changed_when: false
  failed_when: false

- name: Prove node_exporter is running and comes back after a reboot
  ansible.builtin.assert:
    that:
      - (verify_ne_unit.status | default({})).ActiveState | default('unknown') == 'active'
      - (verify_ne_unit.status | default({})).UnitFileState | default('unknown') == 'enabled'
    fail_msg: >-
      {{ inventory_hostname }}: node_exporter is
      {{ (verify_ne_unit.status | default({})).ActiveState | default('unknown') }} and
      {{ (verify_ne_unit.status | default({})).UnitFileState | default('unknown') }}

- name: Wait for the exporter to answer on the Tailscale address
  ansible.builtin.wait_for:
    host: "{{ verify_ne_address }}"
    port: "{{ verify_ne_port }}"
    state: started
    timeout: 90

- name: Read every listener on the exporter port
  ansible.builtin.command: ss -Hltn sport = :{{ verify_ne_port }}
  register: verify_ne_listeners
  changed_when: false

- name: Prove the exporter listens on the Tailscale address and on no other
  ansible.builtin.assert:
    that:
      - verify_ne_listeners.stdout_lines | length == 1
      - (verify_ne_address ~ ':' ~ verify_ne_port) in verify_ne_listeners.stdout
      - ('0.0.0.0:' ~ verify_ne_port) not in verify_ne_listeners.stdout
      - ('*:' ~ verify_ne_port) not in verify_ne_listeners.stdout
      - ('[::]:' ~ verify_ne_port) not in verify_ne_listeners.stdout
    fail_msg: >-
      {{ inventory_hostname }}: expected one listener on
      {{ verify_ne_address }}:{{ verify_ne_port }}, found
      {{ verify_ne_listeners.stdout_lines | default([]) | join(' | ') }}

- name: Prove the metrics endpoint answers over the tailnet
  ansible.builtin.uri:
    url: "http://{{ verify_ne_address }}:{{ verify_ne_port }}/metrics"
    status_code: 200
  register: verify_ne_metrics
  changed_when: false

- name: Prove the exporter port refuses every non-tailnet address of this host
  ansible.builtin.wait_for:
    host: "{{ item }}"
    port: "{{ verify_ne_port }}"
    state: stopped
    timeout: 10
  loop: >-
    {{ ansible_all_ipv4_addresses | default([])
       | difference([verify_ne_address]) | union(['127.0.0.1']) }}

- name: Report this host
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: node_exporter answers on
      {{ verify_ne_address }}:{{ verify_ne_port }} and refuses
      {{ ansible_all_ipv4_addresses | default([]) | difference([verify_ne_address])
         | union(['127.0.0.1']) | join(', ') }}
