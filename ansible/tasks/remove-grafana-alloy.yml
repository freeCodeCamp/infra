---
- name: Remove Grafana Alloy
  ansible.builtin.include_tasks: tasks/remove-systemd-service.yml
  vars:
    svc_unit: alloy
    svc_apt_package: alloy
    svc_user: alloy
    svc_group: alloy
    svc_paths:
      - /usr/local/bin/alloy-linux-amd64
      - /usr/bin/alloy
      - /etc/alloy
      - /etc/default/alloy
      - /var/lib/alloy
      - /home/alloy
      - /var/mail/alloy
      - /etc/apt/sources.list.d/grafana.list
      - /etc/apt/keyrings/grafana.gpg

- name: Remove the Grafana Labs apt key from the legacy trusted keyring
  ansible.builtin.apt_key:
    id: B53AE77BADB630A683046005963FA27710458545
    state: absent
