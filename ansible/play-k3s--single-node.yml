---
# Bootstrap a single-node K3s server.
#
# Idempotent. Safe to re-run against a live node; it converges config and
# restarts k3s only when /etc/rancher/k3s/config.yaml changes.
#
# Prerequisites:
#   - Ubuntu host reachable by Ansible as the freecodecamp user
#   - Tailscale installed and connected (play-tailscale--0-install.yml, then 1a-up)
#
# Config lives in inventory/group_vars/<group>.yml, not here.
#
# Usage:
#   ansible-playbook -i inventory/digitalocean.yml play-k3s--single-node.yml \
#     -e variable_host=ops_o11y

- name: K3s single node - Validate
  hosts: '{{ variable_host | default("null") }}'
  gather_facts: true
  become: true

  tasks:
    - name: Validate group_vars
      assert:
        that:
          - cluster_name is defined and cluster_name | length > 0
          - k3s_version is defined and k3s_version | length > 0
          - k3s_config is defined and k3s_config | length > 0
        fail_msg: "Missing group_vars. Populate inventory/group_vars/{{ variable_host }}.yml"

    - name: Validate a single target host
      assert:
        that: ansible_play_hosts | length == 1
        fail_msg: >-
          This playbook builds a single-node server. {{ ansible_play_hosts | length }}
          hosts matched {{ variable_host }}. Use play-k3s--cluster.yml for HA.

    - name: Validate Tailscale connected
      ansible.builtin.include_tasks: tasks/assert-tailscale.yml

    - name: Set network facts
      set_fact:
        tailscale_ip: "{{ ansible_tailscale0.ipv4.address }}"

- name: K3s single node - Deploy
  hosts: '{{ variable_host | default("null") }}'
  gather_facts: false
  become: true

  tasks:
    - name: Ensure the k3s config directory exists
      file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Write the k3s server config
      copy:
        content: >-
          {{ k3s_config
             | combine({'tls-san': [tailscale_ip, inventory_hostname]})
             | to_nice_yaml(indent=2) }}
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: "0600"
      register: k3s_config_file

    - name: Read the installed k3s version
      command: k3s --version
      register: k3s_installed
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Install k3s
      shell:
        cmd: >-
          curl -sfL https://get.k3s.io |
          INSTALL_K3S_VERSION={{ k3s_version }} sh -s -
        executable: /bin/bash
      when: k3s_version not in (k3s_installed.stdout | default(''))

    - name: Restart k3s when the config changed
      systemd:
        name: k3s
        state: restarted
        daemon_reload: true
      when:
        - k3s_config_file is changed
        - k3s_version in (k3s_installed.stdout | default(''))

- name: K3s single node - Verify
  hosts: '{{ variable_host | default("null") }}'
  gather_facts: false
  become: true
  vars:
    cluster_config_dir: "{{ playbook_dir }}/../k3s/{{ cluster_name }}"

  tasks:
    - name: Wait for the node to report Ready
      command: k3s kubectl wait --for=condition=Ready nodes --all --timeout=300s
      register: node_ready
      retries: 3
      delay: 20
      until: node_ready.rc == 0
      changed_when: false

    - name: Read the kubeconfig
      slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig_raw
      no_log: true

    - name: Ensure the cluster directory exists
      file:
        path: "{{ cluster_config_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    - name: Write the kubeconfig locally
      copy:
        content: "{{ kubeconfig_raw.content | b64decode }}"
        dest: "{{ cluster_config_dir }}/.kubeconfig.yaml"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
      diff: false

    - name: Point the kubeconfig at the tailnet name
      replace:
        path: "{{ cluster_config_dir }}/.kubeconfig.yaml"
        regexp: 'https://127\.0\.0\.1:6443'
        replace: "https://{{ inventory_hostname }}:6443"
      delegate_to: localhost
      become: false
      diff: false

    - name: Name the context after the cluster
      replace:
        path: "{{ cluster_config_dir }}/.kubeconfig.yaml"
        regexp: '(\s+)(name|cluster|user|current-context): default'
        replace: '\1\2: {{ cluster_name }}'
      delegate_to: localhost
      become: false
      diff: false

    - name: Verify kubectl reaches the cluster
      command: kubectl get nodes -o wide
      environment:
        KUBECONFIG: "{{ cluster_config_dir }}/.kubeconfig.yaml"
      register: kubectl_result
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Done
      debug:
        msg:
          - "{{ cluster_name }} ready — kubeconfig at k3s/{{ cluster_name }}/.kubeconfig.yaml"
          - "{{ kubectl_result.stdout_lines }}"
