---
vultr_maps_jms_ports:
  stg:
    eng: 4001
    chn: 4102
    esp: 4103
    ita: 4104
    jpn: 4105
    kor: 4106
    por: 4107
    ukr: 4108
  prd:
    eng: 4201
    chn: 4202
    esp: 4203
    ita: 4204
    jpn: 4205
    kor: 4206
    por: 4207
    ukr: 4208
vultr_maps_api_ports:
  stg: [2445, 2446]
  prd: [2545, 2546]
vultr_maps_socrates_ports:
  stg: [4110, 4111]
  prd: [4210, 4211]
vultr_maps_client_ports: [50505, 52525]
vultr_maps_client_langs:
  - eng
  - chn
  - cnt
  - esp
  - ger
  - ita
  - jpn
  - por
  - ukr
  - swa
  - kor
  - ara
vultr_maps_role_names: "{{ ['pxy', 'api', 'soc', 'nws'] | product(['1', '2', '3']) | map('join', '-') | map('regex_replace', '^', maps_env ~ '-vm-') | list }}"
vultr_maps_client_names: "{{ vultr_maps_client_langs | product(['0', '1']) | map('join', '-') | map('regex_replace', '^', maps_env ~ '-vm-clt-') | list }}"
vultr_maps_names: "{{ vultr_maps_role_names + vultr_maps_client_names }}"
