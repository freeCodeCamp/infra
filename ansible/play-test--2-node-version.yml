---
# Usage: ansible-playbook -i inventory/linode.yml play-test--2-node-version.yml -e variable_host=<group>
- name: Test Node Environment - Print Node/NPM/PM2 Versions
  hosts: "{{ variable_host | default('null') }}"
  gather_facts: false
  become: true
  become_user: freecodecamp
  tasks:
    - name: Print Node, NPM, and PM2 versions
      ansible.builtin.shell: |
        {{ nvm_preamble }}
        echo "Node version:"
        node -v
        echo ""
        echo "NPM version:"
        npm -v
        echo ""
        echo "PM2 version:"
        pm2 -v
        echo ""
        echo "PM2 location:"
        which pm2
      args:
        executable: /bin/bash
        chdir: /home/freecodecamp
      register: version_output
      changed_when: false
      check_mode: false

    - name: Display version information
      ansible.builtin.debug:
        msg: "{{ version_output.stdout_lines }}"
