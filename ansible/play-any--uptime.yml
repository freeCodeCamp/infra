---
- name: Check uptime on virtual machines
  hosts: '{{ variable_host | default("null") }}'
  gather_facts: true
  gather_subset:
    - "!all"
    - "!min"
    - hardware
  become_user: root
  tasks:
    - name: Print uptime
      ansible.builtin.debug:
        msg: "Host machine {{ inventory_hostname }} has been up for {{ ansible_facts.uptime_seconds/86400 }} days"
