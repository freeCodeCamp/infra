---
- name: Configure the base of a Vultr host
  hosts: "{{ variable_host | default('null') }}:&provider_vultr"
  serial: "{{ variable_serial | default(1) }}"
  max_fail_percentage: 0
  become: true
  become_user: root
  roles:
    - ufw_off
    - sudo_user
    - fail2ban
    - docker
    - node-exporter
    - fluent_bit
    - sshd
