---
- name: Test the Vultr map generator
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  check_mode: false
  vars_files:
    - ../vars/vultr-maps.yml
  vars:
    test_dir: "{{ [lookup('ansible.builtin.env', 'TMPDIR') | default('/tmp', true), 'vultr-maps-test'] | path_join }}"
    test_absent: stg-vm-nws-2
    test_blocks:
      - name: jms-eng
        role: nws
        ports:
          stg: [4001]
          prd: [4201]
      - name: jms-chn
        role: nws
        ports:
          stg: [4102]
          prd: [4202]
      - name: jms-esp
        role: nws
        ports:
          stg: [4103]
          prd: [4203]
      - name: jms-ita
        role: nws
        ports:
          stg: [4104]
          prd: [4204]
      - name: jms-jpn
        role: nws
        ports:
          stg: [4105]
          prd: [4205]
      - name: jms-kor
        role: nws
        ports:
          stg: [4106]
          prd: [4206]
      - name: jms-por
        role: nws
        ports:
          stg: [4107]
          prd: [4207]
      - name: jms-ukr
        role: nws
        ports:
          stg: [4108]
          prd: [4208]
      - name: socrates
        role: soc
        ports:
          stg: [4110, 4111]
          prd: [4210, 4211]
        least_conn: true
      - name: api
        role: api
        ports:
          stg: [2445, 2446]
          prd: [2545, 2546]
        least_conn: true
      - name: client-eng
        role: clt-eng
        ports: [50505, 52525]
        least_conn: true
      - name: client-chn
        role: clt-chn
        ports: [50505, 52525]
        least_conn: true
      - name: client-cnt
        role: clt-cnt
        ports: [50505, 52525]
        least_conn: true
      - name: client-esp
        role: clt-esp
        ports: [50505, 52525]
        least_conn: true
      - name: client-ger
        role: clt-ger
        ports: [50505, 52525]
        least_conn: true
      - name: client-ita
        role: clt-ita
        ports: [50505, 52525]
        least_conn: true
      - name: client-jpn
        role: clt-jpn
        ports: [50505, 52525]
        least_conn: true
      - name: client-por
        role: clt-por
        ports: [50505, 52525]
        least_conn: true
      - name: client-ukr
        role: clt-ukr
        ports: [50505, 52525]
        least_conn: true
      - name: client-swa
        role: clt-swa
        ports: [50505, 52525]
        least_conn: true
      - name: client-kor
        role: clt-kor
        ports: [50505, 52525]
        least_conn: true
      - name: client-ara
        role: clt-ara
        ports: [50505, 52525]
        least_conn: true
    maps_upstreams_path: "{{ test_dir }}/upstreams.yaml"
  tasks:
    - name: Make an empty output directory
      ansible.builtin.file:
        path: "{{ test_dir }}"
        state: "{{ item }}"
        mode: "0700"
      loop: [absent, directory]

    - name: Add each staging host with a fake VPC address, one host left out
      ansible.builtin.add_host:
        name: "{{ item }}"
        maps_vpc_ip: "198.51.100.{{ index + 1 }}"
      loop: "{{ vultr_maps_names | difference([test_absent]) }}"
      loop_control:
        index_var: index
      vars:
        maps_env: stg

    - name: Refuse a host with no VPC address
      ansible.builtin.include_tasks: vultr-maps-refused.yml
      vars:
        maps_write: upstreams
        maps_env: stg
        maps_upstreams_path: "{{ test_dir }}/refused-upstreams.yaml"
        test_expect: "{{ test_absent }}"

    - name: Add the host that was left out
      ansible.builtin.add_host:
        name: "{{ test_absent }}"
        maps_vpc_ip: 198.51.100.200

    - name: Refuse an unknown output
      ansible.builtin.include_tasks: vultr-maps-refused.yml
      vars:
        maps_write: everything
        maps_env: stg
        test_expect: maps_write

    - name: Refuse an unknown environment
      ansible.builtin.include_tasks: vultr-maps-refused.yml
      vars:
        maps_write: upstreams
        maps_env: tst
        test_expect: maps_env

    - name: Refuse an upstream map for the manager
      ansible.builtin.include_tasks: vultr-maps-refused.yml
      vars:
        maps_write: upstreams
        maps_env: ops
        maps_upstreams_path: "{{ test_dir }}/refused-upstreams.yaml"
        test_expect: maps_env

    - name: Add each production host with a fake VPC address
      ansible.builtin.add_host:
        name: "{{ item }}"
        maps_vpc_ip: "203.0.113.{{ index + 1 }}"
      loop: "{{ vultr_maps_names }}"
      loop_control:
        index_var: index
      vars:
        maps_env: prd

    - name: Render and check the upstream map of each environment
      ansible.builtin.include_tasks: vultr-maps-rendered.yml
      loop: [stg, prd]
      loop_control:
        loop_var: test_env
