---
- name: Test the Vultr map generator
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  check_mode: false
  vars_files:
    - ../vars/vultr-maps.yml
  vars:
    test_dir: "{{ [lookup('ansible.builtin.env', 'TMPDIR') | default('/tmp', true), 'vultr-maps-test'] | path_join }}"
    test_absent: stg-vm-nws-2
    test_blocks:
      - {name: jms-eng, role: nws, ports: [4001]}
      - {name: jms-chn, role: nws, ports: [4002]}
      - {name: jms-esp, role: nws, ports: [4003]}
      - {name: jms-ita, role: nws, ports: [4004]}
      - {name: jms-jpn, role: nws, ports: [4005]}
      - {name: jms-kor, role: nws, ports: [4006]}
      - {name: jms-por, role: nws, ports: [4007]}
      - {name: jms-ukr, role: nws, ports: [4008]}
      - {name: socrates, role: soc, ports: [4010, 4011], least_conn: true}
      - {name: api, role: api, ports: [2345, 2346], least_conn: true}
      - {name: client-eng, role: clt-eng, ports: [50505, 52525], least_conn: true}
      - {name: client-chn, role: clt-chn, ports: [50505, 52525], least_conn: true}
      - {name: client-cnt, role: clt-cnt, ports: [50505, 52525], least_conn: true}
      - {name: client-esp, role: clt-esp, ports: [50505, 52525], least_conn: true}
      - {name: client-ger, role: clt-ger, ports: [50505, 52525], least_conn: true}
      - {name: client-ita, role: clt-ita, ports: [50505, 52525], least_conn: true}
      - {name: client-jpn, role: clt-jpn, ports: [50505, 52525], least_conn: true}
      - {name: client-por, role: clt-por, ports: [50505, 52525], least_conn: true}
      - {name: client-ukr, role: clt-ukr, ports: [50505, 52525], least_conn: true}
      - {name: client-swa, role: clt-swa, ports: [50505, 52525], least_conn: true}
      - {name: client-kor, role: clt-kor, ports: [50505, 52525], least_conn: true}
      - {name: client-ara, role: clt-ara, ports: [50505, 52525], least_conn: true}
    maps_upstreams_path: "{{ test_dir }}/upstreams.yaml"
    maps_scrape_path: "{{ test_dir }}/scrape-{{ maps_env }}.yaml"
  tasks:
    - name: Make an empty output directory
      ansible.builtin.file:
        path: "{{ test_dir }}"
        state: "{{ item }}"
        mode: "0700"
      loop: [absent, directory]

    - name: Add each staging host with a fake VPC address, one host left out
      ansible.builtin.add_host:
        name: "{{ item }}"
        maps_vpc_ip: "10.50.1.{{ index + 1 }}"
      loop: "{{ vultr_maps_names | difference([test_absent]) }}"
      loop_control:
        index_var: index
      vars:
        maps_env: stg

    - name: Add the manager and an o11y host
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        maps_vpc_ip: "{{ item.ip }}"
      loop:
        - {name: ops-vm-swarm-mgr-1, ip: 10.50.2.1}
        - {name: ops-vm-o11y-1, ip: 10.50.2.2}

    - name: Refuse a host with no VPC address
      ansible.builtin.include_tasks: vultr-maps-refused.yml
      vars:
        maps_write: upstreams
        maps_env: stg
        maps_upstreams_path: "{{ test_dir }}/refused-upstreams.yaml"
        test_expect: "{{ test_absent }}"

    - name: Refuse a scrape file with a host missing
      ansible.builtin.include_tasks: vultr-maps-refused.yml
      vars:
        maps_write: scrape
        maps_env: stg
        maps_scrape_path: "{{ test_dir }}/refused-scrape.yaml"
        test_expect: "{{ test_absent }}"

    - name: Add the host that was left out
      ansible.builtin.add_host:
        name: "{{ test_absent }}"
        maps_vpc_ip: 10.50.1.200

    - name: Refuse an unknown output
      ansible.builtin.include_tasks: vultr-maps-refused.yml
      vars:
        maps_write: everything
        maps_env: stg
        test_expect: maps_write

    - name: Refuse an unknown environment
      ansible.builtin.include_tasks: vultr-maps-refused.yml
      vars:
        maps_write: scrape
        maps_env: tst
        test_expect: maps_env

    - name: Refuse an upstream map for the manager
      ansible.builtin.include_tasks: vultr-maps-refused.yml
      vars:
        maps_write: upstreams
        maps_env: ops
        maps_upstreams_path: "{{ test_dir }}/refused-upstreams.yaml"
        test_expect: maps_env

    - name: Render the upstream map
      ansible.builtin.include_tasks: ../tasks/vultr-maps.yml
      vars:
        maps_write: upstreams
        maps_env: stg

    - name: Read the upstream map
      ansible.builtin.set_fact:
        test_upstreams: "{{ (lookup('ansible.builtin.file', maps_upstreams_path) | from_yaml).nginx_upstreams }}"
      vars:
        maps_env: stg

    - name: Assert the upstream map holds only the expected blocks
      ansible.builtin.assert:
        that:
          - test_upstreams | map(attribute='name') | sort == test_blocks | map(attribute='name') | sort

    - name: Assert each block holds each host on each port
      ansible.builtin.assert:
        that:
          - got.servers == want
          - got.least_conn | default(false) == item.least_conn | default(false)
        fail_msg: "{{ item.name }}: {{ got }} != {{ want }}"
        quiet: true
      vars:
        got: "{{ test_upstreams | selectattr('name', 'eq', item.name) | first }}"
        pattern: "^stg-vm-{{ item.role }}-[0-9]+$"
        want_ips: "{{ groups['all'] | select('match', pattern) | sort | map('extract', hostvars, 'maps_vpc_ip') | list }}"
        want: "{{ want_ips | product(item.ports) | map('join', ':') | list }}"
      loop: "{{ test_blocks }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Render the staging scrape file
      ansible.builtin.include_tasks: ../tasks/vultr-maps.yml
      vars:
        maps_write: scrape
        maps_env: stg

    - name: Render the manager scrape file
      ansible.builtin.include_tasks: ../tasks/vultr-maps.yml
      vars:
        maps_write: scrape
        maps_env: ops

    - name: Read the scrape files
      ansible.builtin.set_fact:
        test_stg: "{{ lookup('ansible.builtin.file', test_dir ~ '/scrape-stg.yaml') | from_yaml_all | list }}"
        test_ops: "{{ lookup('ansible.builtin.file', test_dir ~ '/scrape-ops.yaml') | from_yaml_all | list }}"

    - name: Assert the scrape files hold both jobs with the labels the rules read
      ansible.builtin.assert:
        that:
          - test_stg | map(attribute='metadata.name') | list == ['vultr-stg-node', 'vultr-stg-fluent-bit']
          - test_ops | map(attribute='metadata.name') | list == ['vultr-ops-node', 'vultr-ops-fluent-bit']
          - node.spec.jobName == 'node'
          - fluent.spec.jobName == 'fluent-bit'
          - node.spec.targetEndpoints | length == 36
          - fluent.spec.targetEndpoints | length == 36
          - node.spec.targetEndpoints | map(attribute='path') | unique == ['/metrics']
          - node.spec.targetEndpoints | map(attribute='scrape_interval') | unique == ['60s']
          - fluent.spec.targetEndpoints | map(attribute='path') | unique == ['/api/v2/metrics/prometheus']
          - node_clt.targets == [hostvars['stg-vm-clt-eng-0'].maps_vpc_ip ~ ':9100']
          - fluent_clt.targets == [hostvars['stg-vm-clt-eng-0'].maps_vpc_ip ~ ':2020']
          - "node_clt.labels == {'env': 'stg', 'role': 'clt', 'language': 'eng', 'instance': 'stg-vm-clt-eng-0', 'provider': 'vultr', 'region': 'ewr'}"
          - test_ops[0].spec.targetEndpoints | length == 1
          - "test_ops[0].spec.targetEndpoints[0].targets == ['10.50.2.1:9100']"
          - "mgr_labels == {'env': 'ops', 'role': 'swarm-mgr', 'instance': 'ops-vm-swarm-mgr-1', 'provider': 'vultr', 'region': 'ewr'}"
      vars:
        mgr_labels: "{{ test_ops[0].spec.targetEndpoints[0].labels }}"
        node: "{{ test_stg[0] }}"
        fluent: "{{ test_stg[1] }}"
        node_clt: "{{ node.spec.targetEndpoints | selectattr('labels.instance', 'eq', 'stg-vm-clt-eng-0') | first }}"
        fluent_clt: "{{ fluent.spec.targetEndpoints | selectattr('labels.instance', 'eq', 'stg-vm-clt-eng-0') | first }}"
