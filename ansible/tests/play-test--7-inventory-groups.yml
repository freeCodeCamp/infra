---
- name: Test the constructed inventory groups
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    expected_members:
      tst_pxy: [tst-vm-pxy-1]
      tst_mgr: [tst-vm-mgr-1]
      tst_wkr: [tst-vm-wkr-1]
      stg_api: [stg-vm-api-1]
      prd_pxy: [prd-vm-pxy-2, prd-vm-oldeworld-pxy-1]
      prd_soc: [prd-vm-soc-1]
      prd_nws: [prd-vm-nws-1]
      prd_clt: [prd-vm-clt-eng-0, prd-vm-oldeworld-clt-eng-0]
      prd_clt_eng: [prd-vm-clt-eng-0, prd-vm-oldeworld-clt-eng-0]
      ops_swarm_mgr: [ops-vm-swarm-mgr-1]
      ops_o11y: []
      ops_o11y_vultr: [ops-vm-o11y-1]
      vultr_pxy: [prd-vm-pxy-2]
      vultr_clt: [prd-vm-clt-eng-0]
  tasks:
    - name: Assert each group holds exactly its expected hosts
      ansible.builtin.assert:
        that:
          - groups[item.key] | default([]) | sort == item.value | sort
        fail_msg: "{{ item.key }}: {{ groups[item.key] | default([]) | sort }} != {{ item.value | sort }}"
        quiet: true
      loop: "{{ expected_members | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Assert no Vultr host is in an oldeworld group
      ansible.builtin.assert:
        that:
          - "groups | dict2items | selectattr('key', 'search', 'oldeworld')
            | map(attribute='value') | flatten | intersect(groups['provider_vultr']) | length == 0"
        fail_msg: A Vultr host is in an oldeworld group

    - name: Assert the provider groups do not overlap
      ansible.builtin.assert:
        that:
          - groups['provider_vultr'] | intersect(groups['provider_linode']) | length == 0
        fail_msg: A host is in both provider groups

    - name: Assert the o11y hosts get the K3s settings and the others keep the provider units
      ansible.builtin.assert:
        that:
          - hostvars['ops-vm-o11y-1'].k3s_vpc_cidr == '10.50.0.0/20'
          - hostvars['ops-vm-o11y-1'].node_exporter_systemd_unit_include ==
            '^(cron|docker|fail2ban|fluent-bit|k3s|node_exporter|ssh|tailscaled)[.]service'
          - hostvars['tst-vm-mgr-1'].node_exporter_systemd_unit_include ==
            '^(cron|docker|fail2ban|fluent-bit|node_exporter|ssh|tailscaled)[.]service'
          - hostvars['tst-vm-mgr-1'].k3s_vpc_cidr is not defined
        fail_msg: The o11y K3s settings are wrong or reach other hosts

    - name: Assert the Vultr proxy and client settings reach only Vultr hosts
      ansible.builtin.assert:
        that:
          - hostvars['prd-vm-pxy-2'].pxy_tier == 'prd'
          - hostvars['prd-vm-pxy-2'].nginx_org_series == '1.30'
          - hostvars['prd-vm-pxy-2'].node_exporter_systemd_unit_include ==
            '^(cron|docker|fail2ban|fluent-bit|nginx|node_exporter|ssh|tailscaled)[.]service'
          - hostvars['prd-vm-clt-eng-0'].node_exporter_systemd_unit_include ==
            '^(cron|docker|fail2ban|fluent-bit|node_exporter|pm2-freecodecamp|ssh|tailscaled)[.]service'
          - hostvars['prd-vm-clt-eng-0'].pm2_app_ports == [50505, 52525]
          - hostvars['prd-vm-oldeworld-pxy-1'].nginx_org_series is not defined
          - hostvars['tst-vm-pxy-1'].pxy_tier is not defined
        fail_msg: The Vultr proxy or client settings are wrong or reach other hosts

    - name: Assert hosts outside the naming rule get no new group
      ansible.builtin.assert:
        that:
          - hostvars[item.key].group_names | sort == item.value
        fail_msg: "{{ item.key }}: {{ hostvars[item.key].group_names }}"
        quiet: true
      loop:
        - {key: ops-vm-backoffice, value: [ops_backoffice, provider_linode]}
        - {key: ops-vm-o11y-1, value: [ops_o11y_vultr, provider_vultr]}
      loop_control:
        label: "{{ item.key }}"
