---
- name: Add the Fluent Bit config fixtures
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  check_mode: false
  tasks:
    - name: Add each fixture host
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: fluent_bit_fixture
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
        test_vpc_ip: "{{ item.vpc_ip }}"
        test_push: "{{ item.push }}"
        test_role: "{{ item.role }}"
        test_language: "{{ item.language }}"
        test_token: "{{ item.token }}"
      loop:
        - name: prd-vm-clt-eng-0
          vpc_ip: 198.51.100.10
          push: true
          role: clt
          language: eng
          token: "not-a-secret#fixture: token"
        - name: stg-vm-pxy-1
          vpc_ip: 198.51.100.11
          push: true
          role: pxy
          language: ""
          token: "not-a-secret#fixture: other"
        - name: ops-vm-o11y-1
          vpc_ip: 203.0.113.5
          push: false
          role: o11y
          language: ""
          token: "not-a-secret#fixture: token"

- name: Test the Fluent Bit config
  hosts: all
  gather_facts: false
  become: false
  check_mode: false
  vars_files:
    - ../roles/fluent_bit/defaults/main.yml
  vars:
    test_dir: "{{ [lookup('ansible.builtin.env', 'TMPDIR') | default('/tmp', true), 'fluent-bit-config-test'] | path_join }}"
    test_path: "{{ test_dir }}/{{ inventory_hostname }}.yaml"
  tasks:
    - name: Skip every host that is not a fixture
      ansible.builtin.meta: end_host
      when: "'fluent_bit_fixture' not in group_names"

    - name: Set the host inputs over the role defaults
      ansible.builtin.set_fact:
        fluent_bit_vlagent_host: 203.0.113.5
        fluent_bit_vpc_ip: "{{ test_vpc_ip }}"
        fluent_bit_push_metrics: "{{ test_push | bool }}"
        fluent_bit_sender_token: "{{ test_token }}"

    - name: Make the output directory
      ansible.builtin.file:
        path: "{{ test_dir }}"
        state: directory
        mode: "0700"

    - name: Render the config
      ansible.builtin.template:
        src: ../roles/fluent_bit/templates/fluent-bit.yaml.j2
        dest: "{{ test_path }}"
        mode: "0600"

    - name: Read the config
      ansible.builtin.set_fact:
        test_pipeline: "{{ (lookup('ansible.builtin.file', test_path) | from_yaml).pipeline }}"

    - name: Read the metrics parts
      ansible.builtin.set_fact:
        test_metric_inputs: "{{ test_pipeline.inputs | selectattr('tag', 'match', '^metrics[.]') | list }}"
        test_metric_outputs: "{{ test_pipeline.outputs | selectattr('name', 'eq', 'prometheus_remote_write') | list }}"
        test_log_outputs: "{{ test_pipeline.outputs | selectattr('name', 'eq', 'http') | list }}"
        test_labels: >-
          {{ ['instance ' ~ inventory_hostname, 'env ' ~ inventory_hostname.split('-') | first,
              'role ' ~ test_role, 'provider vultr', 'region ewr']
             + (['language ' ~ test_language] if test_language else []) }}

    - name: Check that log records never reach a metrics output, and metrics never reach the log filter
      ansible.builtin.assert:
        that:
          - test_log_outputs | length == 4
          - test_log_outputs | map(attribute='match') | select('match', '^metrics') | list == []
          - test_pipeline.filters | map(attribute='match') | select('defined') | list == ['journal']
          - test_log_tags | reject('match', test_filter_regex) | list == []
          - test_metric_tags | select('match', test_filter_regex) | list == []
      vars:
        test_filter_regex: "{{ (test_pipeline.filters | selectattr('name', 'eq', 'modify') | first).match_regex }}"
        test_log_tags: [journal, nginx.access, nginx.error, docker]
        test_metric_tags: [metrics.node, metrics.fluentbit]

    - name: Check that the journal drops only the info lines of Fluent Bit itself
      ansible.builtin.assert:
        that:
          - test_grep | length == 1
          - test_grep[0].match == 'journal'
          - test_grep[0].logical_op == 'and'
          - test_grep[0].exclude == ['_SYSTEMD_UNIT ^fluent-bit\.service$', 'MESSAGE ^\[[^\]]+\] \[ info\] ']
      vars:
        test_grep: "{{ test_pipeline.filters | selectattr('name', 'eq', 'grep') | list }}"

    - name: Check that a host without push sends no metrics
      ansible.builtin.assert:
        that:
          - test_metric_inputs == []
          - test_metric_outputs == []
      when: not fluent_bit_push_metrics

    - name: Check the metrics inputs of a pushing host
      ansible.builtin.assert:
        that:
          - test_metric_inputs | length == 2
          - node.name == 'prometheus_scrape'
          - node.host == fluent_bit_vpc_ip
          - node.port == 9100
          - node.metrics_path == '/metrics'
          - node.scrape_interval == '60s'
          - node['storage.type'] == 'filesystem'
          - own.name == 'fluentbit_metrics'
          - own.scrape_interval == '60s'
          - own['storage.type'] == 'filesystem'
      vars:
        node: "{{ test_metric_inputs | selectattr('tag', 'eq', 'metrics.node') | first }}"
        own: "{{ test_metric_inputs | selectattr('tag', 'eq', 'metrics.fluentbit') | first }}"
      when: fluent_bit_push_metrics

    - name: Check the metrics outputs of a pushing host
      ansible.builtin.assert:
        that:
          - test_metric_outputs | length == 2
          - test_metric_outputs | map(attribute='match') | sort == ['metrics.fluentbit', 'metrics.node']
          - test_metric_outputs | map(attribute='host') | unique == ['203.0.113.5']
          - test_metric_outputs | map(attribute='uri') | unique == ['/api/v1/write']
          - test_metric_outputs | map(attribute='retry_limit') | unique == ['no_limits']
          - node['storage.total_limit_size'] == '256M'
          - own['storage.total_limit_size'] == '256M'
          - node.add_label | sort == (test_labels + ['job node']) | sort
          - own.add_label | sort == (test_labels + ['job fluent-bit']) | sort
      vars:
        node: "{{ test_metric_outputs | selectattr('match', 'eq', 'metrics.node') | first }}"
        own: "{{ test_metric_outputs | selectattr('match', 'eq', 'metrics.fluentbit') | first }}"
      when: fluent_bit_push_metrics

    - name: Check that each output goes to vmauth with the sender token
      ansible.builtin.assert:
        that:
          - test_log_outputs | map(attribute='port') | unique == [30427]
          - test_log_outputs | map(attribute='header') | unique == [test_header]
          - test_metric_outputs | map(attribute='port') | unique == ([30427] if fluent_bit_push_metrics else [])
          - test_metric_outputs | map(attribute='header') | unique == ([test_header] if fluent_bit_push_metrics else [])
      vars:
        test_header: "Authorization Bearer {{ test_token }}"

    - name: Check that the role has no intake port that skips vmauth
      ansible.builtin.assert:
        that:
          - fluent_bit_vlagent_port is not defined
          - fluent_bit_metrics_port is not defined

- name: Test the Fluent Bit preflight
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  check_mode: false
  vars_files:
    - ../roles/fluent_bit/defaults/main.yml
  tasks:
    - name: Refuse a receiver without the sender token
      ansible.builtin.include_tasks: fluent-bit-refused.yml
      vars:
        fluent_bit_vlagent_host: 203.0.113.5
        fluent_bit_sender_token: ""
        test_expect: fluent_bit_sender_token

    - name: Refuse a receiver that is not an IPv4 address
      ansible.builtin.include_tasks: fluent-bit-refused.yml
      vars:
        fluent_bit_vlagent_host: o11y.example
        fluent_bit_sender_token: "not-a-secret#fixture: token"
        test_expect: fluent_bit_vlagent_host

    - name: Pass a host without a receiver or a token
      ansible.builtin.include_tasks: ../roles/fluent_bit/tasks/preflight.yml
      vars:
        fluent_bit_vlagent_host: ""
        fluent_bit_sender_token: ""

    - name: Pass a receiver with the sender token
      ansible.builtin.include_tasks: ../roles/fluent_bit/tasks/preflight.yml
      vars:
        fluent_bit_vlagent_host: 203.0.113.5
        fluent_bit_sender_token: "not-a-secret#fixture: token"
