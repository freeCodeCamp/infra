---
# Deploy the observability stack onto the ops-o11y cluster.
#
# Idempotent. Reconciles CoreDNS, the namespaces, the service-discovery
# Secrets and every Helm release named in group_vars.
#
# Prerequisites:
#   - play-k3s--single-node.yml has run, so k3s/<cluster>/.kubeconfig.yaml exists
#   - every env key named in o11y_sd_secrets is in the environment (direnv)
#
# Usage:
#   ansible-playbook -i inventory/digitalocean.yml play-o11y--stack-0-deploy.yml \
#     -e variable_host=ops_o11y
#
#   Add -e o11y_deploy_logs=true to include VictoriaLogs.

- name: O11y - Deploy the stack
  hosts: '{{ variable_host | default("null") }}'
  gather_facts: false
  become: false
  connection: local
  vars:
    cluster_dir: "{{ playbook_dir }}/../k3s/{{ galaxy_name }}"
    kubeconfig: "{{ cluster_dir }}/.kubeconfig.yaml"
    releases: "{{ o11y_releases + (o11y_log_releases if o11y_deploy_logs | bool else []) }}"
    release_namespaces: >-
      {{ ([o11y_namespace]
          + (releases | selectattr('namespace', 'defined')
             | map(attribute='namespace') | list)
          + (o11y_sd_secrets | selectattr('namespace', 'defined')
             | map(attribute='namespace') | list))
         | unique }}

  tasks:
    - name: Check the kubeconfig exists
      ansible.builtin.stat:
        path: "{{ kubeconfig }}"
      register: kubeconfig_file

    - name: Check the cluster is reachable
      ansible.builtin.assert:
        that: kubeconfig_file.stat.exists
        fail_msg: >-
          {{ kubeconfig }} is missing. Run play-k3s--single-node.yml first.

    - name: Check every service-discovery env key is present
      ansible.builtin.assert:
        that: lookup('env', item) | length > 0
        fail_msg: >-
          {{ item }} is empty. It lives in the INFRA_ADMIN-gated
          global/.env.enc envelope; export INFRA_ADMIN=1 and reload direnv, or
          move it to a scoped envelope that ansible/.envrc loads.
      loop: "{{ o11y_sd_secrets | map(attribute='env') | flatten }}"

    - name: Forward ts.net queries to the tailnet resolver
      kubernetes.core.k8s:
        src: "{{ cluster_dir }}/cluster/coredns/coredns-custom.yaml"
        state: present
        kubeconfig: "{{ kubeconfig }}"

    - name: Restart CoreDNS to pick up the forward
      kubernetes.core.k8s:
        api_version: apps/v1
        kind: Deployment
        name: coredns
        namespace: kube-system
        state: patched
        kubeconfig: "{{ kubeconfig }}"
        definition:
          spec:
            template:
              metadata:
                annotations:
                  fcc.dev/coredns-custom: "{{ lookup('file', cluster_dir ~ '/cluster/coredns/coredns-custom.yaml') | hash('sha1') }}"

    - name: Create the namespaces
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ item }}"
        state: present
        kubeconfig: "{{ kubeconfig }}"
      loop: "{{ release_namespaces }}"

    # Each Secret key becomes a mounted filename under /etc/vm/secrets/, which
    # is where the scrape config reads it; renaming a key breaks discovery.
    - name: Create the service-discovery secrets
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          type: Opaque
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ item.namespace | default(o11y_namespace) }}"
          stringData: >-
            {%- set out = {} -%}
            {%- for key in item.env -%}
              {%- set _ = out.update({key: lookup('env', key)}) -%}
            {%- endfor -%}
            {{ out }}
      loop: "{{ o11y_sd_secrets }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true
      diff: false

    - name: Deploy the releases
      kubernetes.core.helm:
        name: "{{ item.name }}"
        chart_ref: "{{ item.chart }}"
        chart_repo_url: "{{ item.repo }}"
        chart_version: "{{ item.version }}"
        release_namespace: "{{ item.namespace | default(o11y_namespace) }}"
        release_state: present
        values_files:
          - "{{ cluster_dir }}/{{ item['values'] }}"
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        wait_timeout: 5m
      loop: "{{ releases }}"
      loop_control:
        label: "{{ item.name }} {{ item.chart }}-{{ item.version }}"

    - name: Wait for the workloads to roll out
      ansible.builtin.include_tasks: tasks/wait-rollout.yml
      vars:
        rollout_kubeconfig: "{{ kubeconfig }}"
        rollout_namespace: "{{ release.namespace | default(o11y_namespace) }}"
        rollout_targets: ["{{ release.rollout }}"]
      loop: "{{ releases }}"
      loop_control:
        loop_var: release
        label: "{{ release.rollout }}"

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ release_namespaces | join(', ') }} ready —
          {{ releases | map(attribute='name') | join(', ') }}
