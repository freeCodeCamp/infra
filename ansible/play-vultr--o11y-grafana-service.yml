---
- name: Serve Grafana on the tailnet from the o11y nodes
  hosts: "{{ variable_host | default('null') }}:&ops_o11y_vultr"
  max_fail_percentage: 0
  become: true
  become_user: root
  gather_facts: false
  tasks:
    - name: Read the Tailscale Services this host serves
      ansible.builtin.command: tailscale serve status --json
      register: grafana_serve_status
      changed_when: false
      check_mode: false

    - name: Read the Tailscale Services this host advertises
      ansible.builtin.command: tailscale debug prefs
      register: grafana_prefs
      changed_when: false
      check_mode: false

    - name: Keep the served and advertised Services
      ansible.builtin.set_fact:
        grafana_serving: "{{ (grafana_serve_status.stdout | from_json).Services | default({}) | list }}"
        grafana_advertised: "{{ (grafana_prefs.stdout | from_json).AdvertiseServices | default([], true) }}"

    - name: Refuse a Service that points at another target
      ansible.builtin.assert:
        that:
          - grafana_found_target == grafana_service_target
        fail_msg: "{{ inventory_hostname }} serves {{ grafana_service }} to {{ grafana_found_target }}, not to {{ grafana_service_target }}."
        quiet: true
      when: grafana_service in grafana_serving
      vars:
        grafana_found_web: "{{ (grafana_serve_status.stdout | from_json).Services[grafana_service].Web | default({}) }}"
        grafana_found_target: "{{ (grafana_found_web | dict2items | first | default({'value': {}})).value.Handlers['/'].Proxy | default('none') }}"

    - name: Serve Grafana on the tailnet
      ansible.builtin.command:
        argv:
          - tailscale
          - serve
          - --service={{ grafana_service }}
          - --https=443
          - --yes
          - "{{ grafana_service_target }}"
      changed_when: true
      when: grafana_service not in grafana_serving

    - name: Advertise the Service again after a Tailscale reset
      ansible.builtin.command:
        argv:
          - tailscale
          - serve
          - advertise
          - "{{ grafana_service }}"
      changed_when: true
      when: grafana_service in grafana_serving and grafana_service not in grafana_advertised
