---
- name: Initialize Oldeworld Cluster - Node.js
  hosts: '{{ variable_host | default("null") }}'
  serial: 1
  become: true
  become_user: freecodecamp
  gather_facts: false
  vars:
    nodejs_global_packages: [npm, pnpm, pm2]
  tasks:
    - name: Install or Update Node.js
      include_role:
        name: nodejs
      vars:
        nodejs_version: '{{ variable_nodejs_version | default("v24") }}'

    - name: Get the Node.js version
      shell:
        cmd: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          node -v
        chdir: /home/freecodecamp
        executable: /bin/bash
      register: node_version_output

    - name: Set the Node.js version fact
      set_fact:
        node_version: '{{ node_version_output.stdout }}'

    - name: Install Global Dependencies
      shell:
        cmd: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          npm i -g {{ (nodejs_global_packages + nodejs_extra_global_packages | default([])) | join(' ') }}
          pm2 jlist | grep -q '"name":"pm2-logrotate"' || pm2 install pm2-logrotate
        chdir: /home/freecodecamp
        executable: /bin/bash

    - name: Refresh PM2
      include_tasks:
        file: tasks/pm2-refresh.yml

    - name: Remove Node.js versions other than the default
      shell:
        cmd: |
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          default=$(nvm version default)
          [[ "$default" == v* ]] || exit 1
          for version in $(ls "$NVM_DIR/versions/node"); do
            [[ "$version" == "$default" ]] && continue
            nvm uninstall "$version" > /dev/null || exit 1
            echo "$version"
          done
        executable: /bin/bash
      register: removed_node_versions
      changed_when: removed_node_versions.stdout | length > 0
