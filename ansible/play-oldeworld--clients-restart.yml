---
# Usage: ansible-playbook -i inventory/linode.yml play-oldeworld--clients-restart.yml -e variable_host=<group>
- name: Restart
  hosts: "{{ variable_host | default('null') }}"
  serial: 1
  max_fail_percentage: 0
  gather_facts: false
  vars:
    dry_run: "{{ variable_dry_run | default(false) | bool }}"
  tasks:
    - name: Read the client start scripts and their ports
      ansible.builtin.include_tasks:
        file: tasks/read-client-start-scripts.yml

    - name: Restart client services (rolling)
      ansible.builtin.include_tasks:
        file: tasks/restart-client-service.yml
      loop:
        - primary
        - secondary
      loop_control:
        loop_var: service_type

    - name: Save PM2 process list
      ansible.builtin.shell: |
        {{ nvm_preamble }}
        pm2 save
      args:
        executable: /bin/bash
        chdir: /home/freecodecamp/client
      when: not dry_run

    - name: Display PM2 process status
      ansible.builtin.shell: |
        {{ nvm_preamble }}
        pm2 ls
      args:
        executable: /bin/bash
        chdir: /home/freecodecamp/client
      register: pm2_status
      changed_when: false

    - name: Show PM2 status
      ansible.builtin.debug:
        msg: "{{ pm2_status.stdout_lines }}"
