---
# Usage: ansible-playbook -i inventory/linode.yml play-any--cleanup-jms.yml -e variable_host=<group>
- name: Cleanup JMS Clients
  hosts: "{{ variable_host | default('null') }}"
  serial: "{{ variable_serial | default(1) }}"
  max_fail_percentage: 0
  gather_facts: false
  tasks:
    - name: Prune stopped containers, unused networks, dangling images and build cache
      ansible.builtin.command:
        cmd: docker system prune --force
      register: prune_result
      changed_when: "'Total reclaimed space: 0B' not in prune_result.stdout"

    - name: Show the reclaimed space
      ansible.builtin.debug:
        msg: "{{ prune_result.stdout_lines | default([]) | last | default('not run') }}"
