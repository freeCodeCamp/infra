---
- name: Read the VPC addresses
  hosts: "~^{{ maps_env | default('null') }}-vm-(?!o11y):&provider_vultr"
  gather_facts: false
  become: false
  tasks:
    - name: Read the VPC address of this host
      ansible.builtin.command: ip -o -4 addr show to {{ vultr_vpc_cidr }}
      register: maps_vpc_addr
      changed_when: false
      check_mode: false

    - name: Refuse a host without exactly one VPC address
      ansible.builtin.assert:
        that:
          - maps_vpc_addr.stdout_lines | length == 1
        fail_msg: "{{ inventory_hostname }}: {{ maps_vpc_addr.stdout_lines }}"

    - name: Keep the VPC address
      ansible.builtin.set_fact:
        maps_vpc_ip: "{{ (maps_vpc_addr.stdout.split()[3]).split('/') | first }}"

- name: Write the map
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - vars/vultr-maps.yml
  vars:
    secrets_dir: "{{ lookup('ansible.builtin.env', 'SECRETS_DIR') | default(playbook_dir ~ '/../../infra-secrets', true) }}"
    maps_upstreams_path: "{{ secrets_dir }}/docker/vultr/pxy-upstreams-{{ maps_env }}.yaml.plaintext"
  tasks:
    - name: Make the output directory
      ansible.builtin.file:
        path: "{{ maps_upstreams_path | dirname }}"
        state: directory
        mode: "0700"
      when: maps_write == 'upstreams'

    - name: Render and write the map
      ansible.builtin.include_tasks: tasks/vultr-maps.yml
