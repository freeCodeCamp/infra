---
# Usage: ansible-playbook -i inventory/linode.yml play-any--fail2ban.yml -e variable_host=<group>
- name: Install and configure fail2ban
  hosts: '{{ variable_host | default("null") }}'
  serial: "{{ variable_serial | default(1) }}"
  max_fail_percentage: 0
  gather_facts: false
  become: true
  become_user: root
  roles:
    - fail2ban
