---
# ops-o11y observability node configuration
# Applied automatically when targeting the ops_o11y inventory group
#
# Single-node K3s on DO FRA1, s-4vcpu-8gb-amd. Not HA by decision — a dead
# collector loses samples, not service. Reached over Tailscale only.

galaxy_name: ops-o11y
k3s_version: v1.36.4+k3s1

node_exporter_systemd_unit_include: "^(cron|k3s|node_exporter|ssh|tailscaled)[.]service"

server_config_yaml: |
  write-kubeconfig-mode: "0600"
  disable:
    - traefik
    - servicelb
  kubelet-arg:
    - system-reserved=cpu=500m,memory=1536Mi
    - eviction-hard=memory.available<500Mi,nodefs.available<10%
  kube-proxy-arg:
    - nodeport-addresses={{ tailnet_cidr }}

o11y_namespace: o11y
o11y_sd_secrets:
  - name: vm-linode-sd
    env:
      - LINODE_API_TOKEN

o11y_releases:
  - name: victoria-metrics
    chart: victoria-metrics-single
    repo: https://victoriametrics.github.io/helm-charts
    version: "0.45.0"
    values: apps/victoria-metrics/charts/victoria-metrics-single/values.yaml
    rollout: statefulset/victoria-metrics-victoria-metrics-single-server
  - name: grafana
    chart: grafana
    repo: https://grafana-community.github.io/helm-charts
    version: "13.1.0"
    values: apps/grafana/charts/grafana/values.yaml
    rollout: deployment/grafana

o11y_log_releases:
  - name: victoria-logs
    chart: victoria-logs-single
    repo: https://victoriametrics.github.io/helm-charts
    version: "0.13.9"
    values: apps/victoria-logs/charts/victoria-logs-single/values.yaml
    rollout: statefulset/victoria-logs-victoria-logs-single-server

o11y_deploy_logs: false
