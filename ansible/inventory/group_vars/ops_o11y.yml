---
# ops-o11y observability node configuration
# Applied automatically when targeting the ops_o11y inventory group
#
# Single-node K3s on DO FRA1, s-4vcpu-8gb-amd. Not HA by decision — a dead
# collector loses samples, not service. Reached over Tailscale only.

cluster_name: ops-o11y
k3s_version: v1.36.4+k3s1

k3s_config:
  write-kubeconfig-mode: "0600"
  disable:
    - traefik
    - servicelb
  kubelet-arg:
    - system-reserved=cpu=500m,memory=1536Mi
    - eviction-hard=memory.available<500Mi,nodefs.available<10%
  kube-proxy-arg:
    - nodeport-addresses=100.64.0.0/10
