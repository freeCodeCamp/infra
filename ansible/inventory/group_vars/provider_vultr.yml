---
vultr_vpc_cidr: 10.50.0.0/20
vultr_internet_check_url: http://archive.ubuntu.com/ubuntu/
vultr_internet_check_delay: 10
vultr_first_configure_marker: /var/lib/freecodecamp-first-configure
vultr_first_configure_lock_timeout: 1800
vultr_first_configure_reboot_timeout: 600

docker_group_users: [freecodecamp]

node_exporter_bind: vpc
node_exporter_vpc_cidr: "{{ vultr_vpc_cidr }}"
node_exporter_systemd_unit_include: "^(cron|docker|fail2ban|fluent-bit|node_exporter|ssh|tailscaled)[.]service"

fluent_bit_ip_allow: "{{ ['localhost', vultr_vpc_cidr] + fluent_bit_ip_allow_extra | default([]) }}"
fluent_bit_vlagent_host: 10.50.0.5
fluent_bit_vpc_cidr: "{{ vultr_vpc_cidr }}"
