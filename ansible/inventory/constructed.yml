---
plugin: ansible.builtin.constructed
strict: false

groups:
  ops_o11y_vultr: "vultr_label | default('') is match('^ops-vm-o11y-[0-9]+$')"

keyed_groups:
  - key:
      "vultr_label | regex_replace('-[0-9]+$', '') | replace('-vm-', '_')
      | replace('-', '_')
      if vultr_label | default('') is match('^[a-z0-9]+-vm-(?!o11y-).+-[0-9]+$') else ''"
    prefix: ""
    separator: ""
  - key:
      "vultr_label | regex_replace('-vm-clt-.*$', '_clt')
      if vultr_label | default('') is match('^[a-z0-9]+-vm-clt-') else ''"
    prefix: ""
    separator: ""
  - key:
      "tags | default([]) | select('match', '^(stg|prd)_oldeworld_[a-z]+$')
      | map('regex_replace', '_oldeworld_', '_') | list"
    prefix: ""
    separator: ""
  - key:
      "tags | select('in', ['eng', 'chn', 'cnt', 'esp', 'ger', 'ita', 'jpn',
      'por', 'ukr', 'swa', 'kor', 'ara'])
      | map('regex_replace', '^', (tags | select('in', ['stg', 'prd']) | first) ~ '_clt_')
      | list if 'clt' in (tags | default([])) else []"
    prefix: ""
    separator: ""
