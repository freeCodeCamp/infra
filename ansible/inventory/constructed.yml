---
plugin: ansible.builtin.constructed
strict: false

groups:
  ops_o11y_vultr: "vultr_label | default('') is match('^ops-vm-o11y-[0-9]+$')"
  vultr_pxy: "vultr_label | default('') is match('^(stg|prd)-vm-pxy-[0-9]+$')"
  vultr_clt: "vultr_label | default('') is match('^(stg|prd)-vm-clt-')"

compose:
  node_exporter_systemd_unit_include:
    "'^(cron|docker|fail2ban|fluent-bit|k3s|node_exporter|ssh|tailscaled)[.]service'
    if vultr_label | default('') is match('^ops-vm-o11y-[0-9]+$') else not_an_o11y_host"

keyed_groups:
  - key: "vultr_label | regex_replace('-[0-9]+$', '') | replace('-vm-', '_')
      | replace('-', '_')
      if vultr_label | default('') is match('^[a-z0-9]+-vm-(?!o11y-).+-[0-9]+$') else ''"
    prefix: ""
    separator: ""
  - key: "vultr_label | regex_replace('-vm-clt-.*$', '_clt')
      if vultr_label | default('') is match('^[a-z0-9]+-vm-clt-') else ''"
    prefix: ""
    separator: ""
