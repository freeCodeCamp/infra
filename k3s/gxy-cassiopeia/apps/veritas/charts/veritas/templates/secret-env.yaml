apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-env-secret
  labels:
    {{- include "veritas.labels" . | nindent 4 }}
type: Opaque
stringData:
  # BetterAuth signing secret. ≥32 chars per apps/api/src/env.ts secretSchema.
  # Mint: `openssl rand -hex 32`. Rotate via sops re-encrypt + helm upgrade.
  BETTER_AUTH_SECRET:   {{ required ".Values.secretEnv.BETTER_AUTH_SECRET is required (provide via sops overlay; ≥32 chars)" .Values.secretEnv.BETTER_AUTH_SECRET | quote }}
  # Google OAuth app credentials (T7 from veritas v0-build dossier).
  # Pair-gated to match apps/api/src/env.ts optional pair-refine + auth/index.ts
  # conditional mount: provider only attaches when BOTH keys are present.
  {{- if and .Values.secretEnv.GOOGLE_CLIENT_ID .Values.secretEnv.GOOGLE_CLIENT_SECRET }}
  GOOGLE_CLIENT_ID:     {{ .Values.secretEnv.GOOGLE_CLIENT_ID | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secretEnv.GOOGLE_CLIENT_SECRET | quote }}
  {{- end }}
  # GitHub + Apple went live per ADR-004 2026-07-29; each pair-gated like Google
  # (apps/api/src/env.ts pair refines + auth/index.ts conditional mounts).
  {{- if and .Values.secretEnv.GITHUB_CLIENT_ID .Values.secretEnv.GITHUB_CLIENT_SECRET }}
  GITHUB_CLIENT_ID:     {{ .Values.secretEnv.GITHUB_CLIENT_ID | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.secretEnv.GITHUB_CLIENT_SECRET | quote }}
  {{- end }}
  # Apple: APPLE_CLIENT_SECRET is a self-signed ES256 JWT (exp <= 6 months),
  # not a static portal value. Re-mint + roll the sops envelope before expiry.
  # The bundle identifier is optional and independent of the pair.
  {{- if and .Values.secretEnv.APPLE_CLIENT_ID .Values.secretEnv.APPLE_CLIENT_SECRET }}
  APPLE_CLIENT_ID:      {{ .Values.secretEnv.APPLE_CLIENT_ID | quote }}
  APPLE_CLIENT_SECRET:  {{ .Values.secretEnv.APPLE_CLIENT_SECRET | quote }}
  {{- if .Values.secretEnv.APPLE_APP_BUNDLE_IDENTIFIER }}
  APPLE_APP_BUNDLE_IDENTIFIER: {{ .Values.secretEnv.APPLE_APP_BUNDLE_IDENTIFIER | quote }}
  {{- end }}
  {{- end }}
  # SES SMTP credentials (EMAIL_TRANSPORT=smtp). apps/api/src/mailer.ts sends
  # auth only when SMTP_USER is set and env.ts pairs nothing, so gate both.
  {{- if and .Values.secretEnv.SMTP_USER .Values.secretEnv.SMTP_PASS }}
  SMTP_USER:            {{ .Values.secretEnv.SMTP_USER | quote }}
  SMTP_PASS:            {{ .Values.secretEnv.SMTP_PASS | quote }}
  {{- end }}
  # Sentry DSN — errors + traces are a no-op when absent.
  {{- if .Values.secretEnv.SENTRY_DSN }}
  SENTRY_DSN:           {{ .Values.secretEnv.SENTRY_DSN | quote }}
  {{- end }}
  # Bearer for the one-time POST /internal/bootstrap. Optional per
  # apps/api/src/env.ts; bootstrap fails closed when absent (no auth hole).
  # Rendered only when the sops overlay supplies it.
  {{- if .Values.secretEnv.INTERNAL_API_TOKEN }}
  INTERNAL_API_TOKEN:   {{ .Values.secretEnv.INTERNAL_API_TOKEN | quote }}
  {{- end }}
  # External Valkey connection string when it carries credentials
  # (redis[s]://user:pass@host:port). Keeps the password out of the plaintext
  # ConfigMap. Only for valkey.deploy=false; the in-namespace Valkey is unauthed.
  {{- if and (not .Values.valkey.deploy) .Values.secretEnv.VALKEY_URL }}
  VALKEY_URL:           {{ .Values.secretEnv.VALKEY_URL | quote }}
  {{- end }}
