{{/*
HTTPRoute for the auth-console.freecodecamp.org listener.

Shape identical to httproute-login.yaml — same public-block rule for
/metrics + /readyz, same middleware chain on the catch-all. The split
on hostname here is purely for Gateway listener binding (sectionName).
Veritas's internal host-routing middleware (apps/api/src T12) selects
the handler tree once the Host header arrives at the pod.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-route-console
  labels:
    {{- include "veritas.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}-gateway
      sectionName: web-secure-console
  hostnames:
    - {{ required ".Values.gateway.hostnames.console is required" .Values.gateway.hostnames.console | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /metrics
        - path:
            type: PathPrefix
            value: /readyz
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /_veritas_blocked_path
      backendRefs:
        - name: {{ .Release.Name }}
          port: {{ .Values.service.port }}

    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ .Release.Name }}-ratelimit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ .Values.middlewares.secureHeaders }}
      backendRefs:
        - name: {{ .Release.Name }}
          port: {{ .Values.service.port }}
