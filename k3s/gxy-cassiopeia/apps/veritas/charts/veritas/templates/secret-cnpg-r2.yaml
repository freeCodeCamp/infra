{{- if .Values.cnpg.backup.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  # Fixed name referenced by the CNPG Cluster CR
  # (templates/cnpg-cluster.yaml `backup.barmanObjectStore.s3Credentials`).
  # Keep name stable across releases so rotations don't require Cluster
  # CR re-apply.
  name: cnpg-r2-creds
  labels:
    {{- include "veritas.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Bucket-scoped R2 API token (NOT the r2-gxy admin token — operator
  # mints a token scoped to `cassiopeia-cnpg-backups` only). Endpoint URL
  # held here too (account-id portion of host is not itself secret but
  # defense-in-depth — single envelope holds the whole barman tuple).
  ACCESS_KEY_ID: {{ required ".Values.cnpgR2.accessKeyId is required (provide via sops overlay; bucket-scoped R2 token)" .Values.cnpgR2.accessKeyId | quote }}
  SECRET_ACCESS_KEY: {{ required ".Values.cnpgR2.secretAccessKey is required (provide via sops overlay)" .Values.cnpgR2.secretAccessKey | quote }}
  ENDPOINT: {{ required ".Values.cnpgR2.endpoint is required (https://<account>.r2.cloudflarestorage.com)" .Values.cnpgR2.endpoint | quote }}
{{- end }}
