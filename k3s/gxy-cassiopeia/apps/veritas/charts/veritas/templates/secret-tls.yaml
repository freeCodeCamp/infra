apiVersion: v1
kind: Secret
metadata:
  # Fixed name referenced by the Gateway TLS certificateRefs
  # (templates/gateway.yaml). Keep stable across releases so cert
  # rotations only need a chart-values re-render (Gateway CR ref unchanged).
  name: veritas-tls
  labels:
    {{- include "veritas.labels" . | nindent 4 }}
type: kubernetes.io/tls
stringData:
  # Origin certificate chain for CF→origin HTTPS (zone freecodecamp.org
  # is Full/Strict). The wildcard CF Origin certificate (*.freecodecamp.org)
  # covers login, account and auth-console.
  # Supplied via sops overlay (infra-secrets/k3s/gxy-cassiopeia/veritas.values.yaml.enc).
  # Mint via CF dashboard → SSL/TLS → Origin Server → Create Certificate
  # (CF Origin CA is simplest — 15-year cert, only valid via CF proxy).
  tls.crt: {{ required ".Values.tls.crt is required (PEM-encoded cert chain — provide via sops overlay)" .Values.tls.crt | quote }}
  tls.key: {{ required ".Values.tls.key is required (PEM-encoded private key — provide via sops overlay)" .Values.tls.key | quote }}
