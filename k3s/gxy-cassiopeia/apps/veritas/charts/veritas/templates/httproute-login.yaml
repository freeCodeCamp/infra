{{/*
HTTPRoute for the login.freecodecamp.org listener.

Operator-only paths (`/metrics`, `/readyz`) are routed first to a
rewritten not-found path so external callers via the public Gateway
see Hono's 404 instead of metrics exposition or DB-health response.
In-cluster scrape (Prometheus → Service:port) and k8s readinessProbe
(kubelet → pod IP) both bypass this HTTPRoute and continue to reach
the real handlers. `/healthz` stays public — documented external
liveness probe. Mirrors artemis TestPublicRouteBlock contract (V7).
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-route-login
  labels:
    {{- include "veritas.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}-gateway
      sectionName: web-secure-login
  hostnames:
    - {{ required ".Values.gateway.hostnames.login is required" .Values.gateway.hostnames.login | quote }}
  rules:
    # Public-block: rewrite /metrics + /readyz to an unrouted path
    # (Hono returns 404 for unknown). Must come BEFORE the catch-all
    # PathPrefix `/` — Gateway API rule precedence is most-specific-first.
    - matches:
        - path:
            type: PathPrefix
            value: /metrics
        - path:
            type: PathPrefix
            value: /readyz
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /_veritas_blocked_path
      backendRefs:
        - name: {{ .Release.Name }}
          port: {{ .Values.service.port }}

    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ .Release.Name }}-ratelimit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ .Values.middlewares.secureHeaders }}
      backendRefs:
        - name: {{ .Release.Name }}
          port: {{ .Values.service.port }}
