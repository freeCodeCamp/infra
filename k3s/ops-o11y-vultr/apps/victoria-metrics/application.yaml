apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://victoriametrics.github.io/helm-charts
      chart: victoria-metrics-k8s-stack
      targetRevision: "0.96.0"
      helm:
        releaseName: victoria-metrics
        valueFiles:
          - $values/k3s/ops-o11y-vultr/apps/victoria-metrics/charts/victoria-metrics-k8s-stack/values.yaml
    - repoURL: https://github.com/freeCodeCamp/infra.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/freeCodeCamp/infra.git
      targetRevision: main
      path: k3s/ops-o11y-vultr/cluster/victoria-metrics
  destination:
    server: https://kubernetes.default.svc
    namespace: o11y
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
