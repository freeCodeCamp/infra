rbac:
  create: false

automountServiceAccountToken: false

testFramework:
  enabled: false

admin:
  existingSecret: grafana-admin

service:
  type: NodePort
  nodePort: 30300

persistence:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

envValueFrom:
  VMAUTH_LOGS_PASSWORD:
    secretKeyRef:
      name: vmauth-logs-reader
      key: password

plugins:
  - victoriametrics-logs-datasource@0.33.1

grafana.ini:
  analytics:
    reporting_enabled: false
    check_for_updates: false
    check_for_plugin_updates: false
  users:
    allow_sign_up: false
  auth.anonymous:
    enabled: false
  dashboards:
    default_home_dashboard_path: /var/lib/grafana/dashboards/freecodecamp/traffic.json

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        uid: victoriametrics
        access: proxy
        url: http://vmselect-vm.o11y.svc:8481/select/0/prometheus
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          timeInterval: 30s
      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        uid: victorialogs
        access: proxy
        url: http://vmauth-o11y.o11y.svc:8427
        editable: false
        basicAuth: true
        basicAuthUser: ops
        secureJsonData:
          basicAuthPassword: $VMAUTH_LOGS_PASSWORD

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: freecodecamp
        orgId: 1
        folder: freeCodeCamp
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/freecodecamp
      - name: victoriametrics
        orgId: 1
        folder: VictoriaMetrics
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/victoriametrics
      - name: hosts
        orgId: 1
        folder: Hosts
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/hosts

dashboardsConfigMaps:
  freecodecamp: grafana-dashboards-freecodecamp

defaultCurlOptions: "-sfL --retry 3"

dashboards:
  victoriametrics:
    victoriametrics-cluster:
      url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/29c43cd2fee05409499a4d1b38e950e1b7f13bd4/dashboards/victoriametrics-cluster.json
    vmagent:
      url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/29c43cd2fee05409499a4d1b38e950e1b7f13bd4/dashboards/vmagent.json
    vmalert:
      url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/29c43cd2fee05409499a4d1b38e950e1b7f13bd4/dashboards/vmalert.json
    vmauth:
      url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/29c43cd2fee05409499a4d1b38e950e1b7f13bd4/dashboards/vmauth.json
    operator:
      url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/29c43cd2fee05409499a4d1b38e950e1b7f13bd4/dashboards/operator.json
    victorialogs:
      url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaLogs/915d91904bf7f5be66ab00f88947ae7fc1431acc/dashboards/victorialogs.json
    vlagent:
      url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaLogs/915d91904bf7f5be66ab00f88947ae7fc1431acc/dashboards/vlagent.json
  hosts:
    node-exporter-full:
      url: https://raw.githubusercontent.com/rfmoz/grafana-dashboards/b07d8a90d8fadd112e9ac841b777ee863cda850b/prometheus/node-exporter-full.json
