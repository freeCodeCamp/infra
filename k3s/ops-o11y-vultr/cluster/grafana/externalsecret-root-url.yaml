apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-root-url
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-root-url
    creationPolicy: Owner
  data:
    - secretKey: GF_SERVER_ROOT_URL
      remoteRef:
        key: o11y-grafana-admin/grafana-root-url
