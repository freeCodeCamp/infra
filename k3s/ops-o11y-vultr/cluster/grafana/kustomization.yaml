apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: o11y
resources:
  - externalsecret-admin.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: freeCodeCamp
configMapGenerator:
  - name: grafana-dashboard-traffic
    files:
      - dashboards/traffic.json
  - name: grafana-dashboard-fleet
    files:
      - dashboards/fleet.json
