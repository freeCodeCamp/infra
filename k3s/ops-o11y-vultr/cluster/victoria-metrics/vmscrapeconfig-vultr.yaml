      regex: "(stg|prd)-vm-(api|soc|nws|pxy|clt)-.+|ops-vm-swarm-mgr-[0-9]+"
      action: keep
    - sourceLabels: [__meta_vultr_instance_internal_ip, __address__]
      regex: "(.+);[^:]+:([0-9]+)"
      replacement: "$1:$2"
      targetLabel: __address__
    - sourceLabels: [__meta_vultr_instance_label]
      regex: "([a-z]+)-vm-(swarm-mgr|[a-z]+)-.+"
      replacement: "$1"
      targetLabel: env
    - sourceLabels: [__meta_vultr_instance_label]
      regex: "([a-z]+)-vm-(swarm-mgr|[a-z]+)-.+"
      replacement: "$2"
      targetLabel: role
    - sourceLabels: [__meta_vultr_instance_label]
      regex: "[a-z]+-vm-clt-([a-z]+)-[0-9]+"
      replacement: "$1"
      targetLabel: language
    - sourceLabels: [__meta_vultr_instance_label]
      targetLabel: instance
    - sourceLabels: [__meta_vultr_instance_region]
