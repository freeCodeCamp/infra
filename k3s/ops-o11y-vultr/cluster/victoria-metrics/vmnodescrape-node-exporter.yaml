apiVersion: operator.victoriametrics.com/v1beta1
kind: VMNodeScrape
metadata:
  name: node-exporter
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  port: "9100"
  path: /metrics
  relabelConfigs:
    - sourceLabels: [__meta_kubernetes_node_name]
      targetLabel: instance
