apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sentry-watchdog-checkin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: sentry-watchdog-checkin
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: o11y-sentry-watchdog-checkin/credential
