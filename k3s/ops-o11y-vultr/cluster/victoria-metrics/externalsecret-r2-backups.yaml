apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: o11y-r2-backups
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: o11y-r2-backups
    creationPolicy: Owner
    template:
      data:
        access_key_id: "{{ .access_key_id }}"
        secret_access_key: "{{ .secret_access_key }}"
        endpoint: '{{ regexReplaceAll "^(https://[^/]+).*$" .endpoint "${1}" }}'
  data:
    - secretKey: access_key_id
      remoteRef:
        key: o11y-r2-backups/Access Key ID
    - secretKey: secret_access_key
      remoteRef:
        key: o11y-r2-backups/Secret Access Key
    - secretKey: endpoint
      remoteRef:
        key: o11y-r2-backups/Endpoint
