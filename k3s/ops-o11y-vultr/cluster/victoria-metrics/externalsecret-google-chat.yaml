apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: calert-google-chat
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: calert-google-chat
    creationPolicy: Owner
  data:
    - secretKey: endpoint
      remoteRef:
        key: o11y-google-chat-webhook/credential
