apiVersion: batch/v1
kind: CronJob
metadata:
  name: vmbackup-vmstorage-vm-0
spec:
  schedule: "0 7 * * *"
  startingDeadlineSeconds: 3600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: vmbackup
              image: victoriametrics/vmbackup:v1.154.0
              command:
                - /bin/sh
                - -c
              args:
                - |
                  set -eu
                  dst=s3://ops-o11y-backups/vmstorage/vmstorage-vm-0
                  url=http://vmstorage-vm-0.vmstorage-vm.o11y.svc:8482/snapshot/create
                  /vmbackup-prod -storageDataPath=/vm-data -snapshot.createURL="$url" -dst="$dst" -customS3Endpoint="$R2_ENDPOINT"
                  if [ "$(date +%u)" = 7 ]; then
                    /vmbackup-prod -storageDataPath=/vm-data -snapshot.createURL="$url" -dst="s3://ops-o11y-backups/vmstorage-weekly/$(date +%G-W%V)/vmstorage-vm-0" -origin="$dst" -customS3Endpoint="$R2_ENDPOINT"
                  fi
              env:
                - name: AWS_REGION
                  value: auto
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: o11y-r2-backups
                      key: access_key_id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: o11y-r2-backups
                      key: secret_access_key
                - name: R2_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: o11y-r2-backups
                      key: endpoint
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: data
                  mountPath: /vm-data
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: vmstorage-db-vmstorage-vm-0
---
