apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vultr-sd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: vultr-sd
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: o11y-vultr-sd-reader/credential
