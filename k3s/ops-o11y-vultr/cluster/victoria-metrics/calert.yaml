apiVersion: v1
kind: ConfigMap
metadata:
  name: calert-config
data:
  config.toml: |
    [app]
    address = "0.0.0.0:6000"
    server_timeout = "60s"
    enable_request_logs = true
    log = "info"

    [providers.google_chat]
    type = "google_chat"
    max_idle_conns = 50
    timeout = "30s"
    template = "static/message.tmpl"
    thread_ttl = "12h"
    threaded_replies = true
    threading_mode = "alert"
    dry_run = false
    retry_max = 3
    retry_wait_min = "1s"
    retry_wait_max = "5s"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calert
  labels:
    app.kubernetes.io/name: calert
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: calert
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calert
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: calert
              topologyKey: kubernetes.io/hostname
      containers:
        - name: calert
          image: ghcr.io/mr-karan/calert:v2.4.0
          args:
            - --config=/app/config.toml
          env:
            - name: CALERT_PROVIDERS__GOOGLE_CHAT__ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: calert-google-chat
                  key: endpoint
          ports:
            - name: http
              containerPort: 6000
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /app/config.toml
              subPath: config.toml
      volumes:
        - name: config
          configMap:
            name: calert-config
---
apiVersion: v1
kind: Service
metadata:
  name: calert
spec:
  selector:
    app.kubernetes.io/name: calert
  ports:
    - name: http
      port: 6000
      targetPort: http
