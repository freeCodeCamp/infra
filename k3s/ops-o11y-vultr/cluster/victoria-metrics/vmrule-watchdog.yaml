apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: watchdog
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - name: watchdog
      rules:
        - alert: Watchdog
          expr: vector(1)
          labels:
            severity: none
          annotations:
            summary: >-
              Always fires. The watchdog-checkin CronJob sends a Sentry check-in while it is active.
            runbook_url:
              "https://github.com/freeCodeCamp/infra/blob/main/docs/runbooks/\
              19-o11y-alerts.md#watchdog"
