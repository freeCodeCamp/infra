apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: hosts
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - name: hosts
      interval: 1m
      rules:
        - alert: HostDown
          expr: |
            lag(node_boot_time_seconds{job="node",provider="vultr",role!="pxy"}[1d]) > 120
            and on() (count(lag(node_boot_time_seconds{job="node",provider="vultr"}[1d]) <= 120) > 0)
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.env }} {{ $labels.role }} host {{ $labels.instance }} is down."
            runbook_url:
              "https://github.com/freeCodeCamp/infra/blob/main/docs/runbooks/\
              19-o11y-alerts.md#hostdown"
        - alert: NginxVmDown
          expr: |
            lag(node_boot_time_seconds{job="node",provider="vultr",role="pxy"}[1d]) > 120
            and on() (count(lag(node_boot_time_seconds{job="node",provider="vultr"}[1d]) <= 120) > 0)
            or node_systemd_unit_state{job="node",role="pxy",name="nginx.service",state="active"}
            == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.env }} NGINX VM {{ $labels.instance }} is down."
            runbook_url:
              "https://github.com/freeCodeCamp/infra/blob/main/docs/runbooks/\
              19-o11y-alerts.md#nginxvmdown"
        - alert: DiskSpaceLow
          expr: |
            1 - node_filesystem_avail_bytes{job=~"node|o11y/node-exporter",mountpoint="/"}
            / node_filesystem_size_bytes{job=~"node|o11y/node-exporter",mountpoint="/"} > 0.85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} root disk is {{ $value | humanizePercentage }} full."
            runbook_url:
              "https://github.com/freeCodeCamp/infra/blob/main/docs/runbooks/\
              19-o11y-alerts.md#diskspacelow"
        - alert: MemoryHigh
          expr: |
            1 - node_memory_MemAvailable_bytes{job=~"node|o11y/node-exporter"}
            / node_memory_MemTotal_bytes{job=~"node|o11y/node-exporter"} > 0.9
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} memory is {{ $value | humanizePercentage }} used."
            runbook_url:
              "https://github.com/freeCodeCamp/infra/blob/main/docs/runbooks/\
              19-o11y-alerts.md#memoryhigh"
        - alert: VultrMetricsPushDown
          expr: absent(lag(node_boot_time_seconds{job="node",provider="vultr"}[1d]) <= 120)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: No Vultr host has sent metrics for 2 minutes.
            runbook_url:
              "https://github.com/freeCodeCamp/infra/blob/main/docs/runbooks/\
              19-o11y-alerts.md#vultrmetricspushdown"
    - name: scrape
      interval: 1m
      rules:
        - alert: TargetDown
          expr: up{job!="node"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.job }} target {{ $labels.instance }} is down."
            runbook_url:
              "https://github.com/freeCodeCamp/infra/blob/main/docs/runbooks/\
              19-o11y-alerts.md#targetdown"
        - alert: ProbeFailed
          expr: probe_success == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.env }} probe of {{ $labels.instance }} fails."
            runbook_url:
              "https://github.com/freeCodeCamp/infra/blob/main/docs/runbooks/\
              19-o11y-alerts.md#probefailed"
        - alert: ScrapeConfigReloadFailed
          expr: vm_promscrape_config_last_reload_successful == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pod }} cannot load its new scrape config."
            runbook_url:
              "https://github.com/freeCodeCamp/infra/blob/main/docs/runbooks/\
              19-o11y-alerts.md#scrapeconfigreloadfailed"
        - alert: VmalertExecutionErrors
          expr: increase(vmalert_execution_errors_total[10m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.job }} pod {{ $labels.pod }} cannot run its rules."
            runbook_url:
              "https://github.com/freeCodeCamp/infra/blob/main/docs/runbooks/\
              19-o11y-alerts.md#vmalertexecutionerrors"
        - alert: O11yBackupStale
          expr: time() - (kube_cronjob_status_last_successful_time{namespace="o11y",cronjob=~"vmbackup-.*|vlogs-backup"} or kube_cronjob_created{namespace="o11y",cronjob=~"vmbackup-.*|vlogs-backup"}) > 129600
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "CronJob {{ $labels.cronjob }} has had no successful backup for 36 hours."
            runbook_url:
              "https://github.com/freeCodeCamp/infra/blob/main/docs/runbooks/\
              19-o11y-alerts.md#o11ybackupstale"
    - name: fluent-bit
      interval: 1m
      rules:
        - alert: FluentBitDroppedRecords
          expr: increase_pure(fluentbit_output_dropped_records_total{job="fluent-bit"}[15m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Fluent Bit output {{ $labels.name }} on {{ $labels.instance }} dropped records."
            runbook_url:
              "https://github.com/freeCodeCamp/infra/blob/main/docs/runbooks/\
              19-o11y-alerts.md#fluentbitdroppedrecords"
        - alert: FluentBitBufferBacklog
          expr: fluentbit_output_chunk_available_capacity_percent{job="fluent-bit"} < 50
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Fluent Bit output {{ $labels.name }} on {{ $labels.instance }} has used half of its buffer."
            runbook_url:
              "https://github.com/freeCodeCamp/infra/blob/main/docs/runbooks/\
              19-o11y-alerts.md#fluentbitbufferbacklog"
    - name: argocd
      interval: 1m
      rules:
        - alert: ArgoCDAppUnhealthy
          expr: |
            max by (name) (
              argocd_app_info{health_status!="Healthy"}
              or argocd_app_info{sync_status!="Synced"}
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD app {{ $labels.name }} is not Healthy and Synced for 15 minutes."
            runbook_url:
              "https://github.com/freeCodeCamp/infra/blob/main/docs/runbooks/\
              19-o11y-alerts.md#argocdappunhealthy"
