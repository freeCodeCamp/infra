apiVersion: operator.victoriametrics.com/v1
kind: VLSingle
metadata:
  name: vlogs-a
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  retentionPeriod: 14d
  retentionMaxDiskSpaceUsageBytes: 50GiB
  podMetadata:
    labels:
      o11y.freecodecamp.org/component: vlogs
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              o11y.freecodecamp.org/component: vlogs
          topologyKey: kubernetes.io/hostname
  storage:
    accessModes: [ReadWriteOnce]
    resources:
      requests:
        storage: 70Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
