apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  name: o11y
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  replicaCount: 2
  selectAllByDefault: false
  userSelector:
    matchLabels:
      o11y.freecodecamp.org/vmauth: o11y
  podMetadata:
    labels:
      o11y.freecodecamp.org/component: vmauth
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              o11y.freecodecamp.org/component: vmauth
          topologyKey: kubernetes.io/hostname
  serviceSpec:
    useAsDefault: true
    spec:
      type: NodePort
      ports:
        - name: http
          port: 8427
          targetPort: 8427
          nodePort: 30427
          protocol: TCP
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: logs-reader
  labels:
    o11y.freecodecamp.org/vmauth: o11y
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  username: ops
  passwordRef:
    name: vmauth-logs-reader
    key: password
  max_concurrent_requests: 8
  targetRefs:
    - static:
        urls:
          - http://vlsingle-vlogs-a.o11y.svc:9428
          - http://vlsingle-vlogs-b.o11y.svc:9428
      paths:
        - /select/logsql/.*
        - /select/vmui.*
      load_balancing_policy: first_available
    - static:
        urls:
          - http://vmselect-vm.o11y.svc:8481
      paths:
        - /select/0/vmui.*
        - /select/0/prometheus/.*
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmauth-logs-reader
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: vmauth-logs-reader
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: o11y-vmauth-logs-reader/password
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: fluent-bit-sender
  labels:
    o11y.freecodecamp.org/vmauth: o11y
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  tokenRef:
    name: vmauth-fluent-bit-sender
    key: token
  targetRefs:
    - static:
        url: http://vlagent-vlagent.o11y.svc:9429
      paths:
        - /insert/jsonline
    - static:
        url: http://vmagent-vm.o11y.svc:8429
      paths:
        - /api/v1/write
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmauth-fluent-bit-sender
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: vmauth-fluent-bit-sender
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: o11y-fluent-bit-sender/credential
