apiVersion: batch/v1
kind: Job
metadata:
  name: restore-vmstorage-vm-0
  labels:
    restore-disk: vmstorage-vm-0
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: vmrestore
          image: victoriametrics/vmrestore:v1.154.0
          args:
            - -storageDataPath=/vm-data
            - -src=s3://ops-o11y-backups/vmstorage/vmstorage-vm-0
            - -customS3Endpoint=$(R2_ENDPOINT)
          env:
            - name: AWS_REGION
              value: auto
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: o11y-r2-backups
                  key: access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: o11y-r2-backups
                  key: secret_access_key
            - name: R2_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: o11y-r2-backups
                  key: endpoint
          volumeMounts:
            - name: data
              mountPath: /vm-data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vmstorage-db-vmstorage-vm-0
---
