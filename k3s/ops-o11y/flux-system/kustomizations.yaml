apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-controllers
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: infra
  path: ./k3s/ops-o11y/platform/controllers
  prune: true
  wait: true
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-controllers
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: infra
  path: ./k3s/ops-o11y/platform/configs
  prune: true
  wait: true
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rancher
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-configs
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: infra
  path: ./k3s/ops-o11y/platform/rancher
  prune: true
  timeout: 15m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-dns
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: infra
  path: ./k3s/ops-o11y/cluster/coredns
  prune: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-configs
    - name: cluster-dns
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: infra
  path: ./k3s/ops-o11y/apps
  prune: true
  wait: true
  timeout: 10m
