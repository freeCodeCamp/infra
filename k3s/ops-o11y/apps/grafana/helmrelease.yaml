apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 30m
  chart:
    spec:
      chart: grafana
      version: "13.1.0"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: grafana-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: grafana-values
      valuesKey: values-mgmt.yaml
