apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-alerting
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-alerting
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: mgmt-grafana-alerting
