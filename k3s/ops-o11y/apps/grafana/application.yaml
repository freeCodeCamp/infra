apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: "13.1.0"
      helm:
        releaseName: grafana
        valueFiles:
          - $values/k3s/ops-o11y/apps/grafana/charts/grafana/values.yaml
    - repoURL: https://github.com/freeCodeCamp/infra.git
      targetRevision: feat/bare-metal
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: o11y
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
