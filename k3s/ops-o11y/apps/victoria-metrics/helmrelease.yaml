apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  interval: 30m
  chart:
    spec:
      chart: victoria-metrics-single
      version: "0.45.0"
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: victoria-metrics-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: victoria-metrics-values
      valuesKey: values-mgmt.yaml
