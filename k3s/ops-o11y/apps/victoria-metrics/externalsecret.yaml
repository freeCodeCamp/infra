apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vm-linode-sd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: vm-linode-sd
    creationPolicy: Owner
  data:
    - secretKey: LINODE_API_TOKEN
      remoteRef:
        key: mgmt-linode-sd-token
        property: token
