apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onepassword-connect
spec:
  interval: 30m
  chart:
    spec:
      chart: connect
      version: "2.4.1"
      sourceRef:
        kind: HelmRepository
        name: onepassword
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    connect:
      create: true
      replicas: 1
      serviceType: ClusterIP
      credentialsName: op-credentials
      credentialsKey: 1password-credentials.json
    operator:
      create: false
