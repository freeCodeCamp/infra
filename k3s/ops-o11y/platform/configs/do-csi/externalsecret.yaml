apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: digitalocean
  namespace: kube-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: digitalocean
    creationPolicy: Owner
  data:
    - secretKey: access-token
      remoteRef:
        key: mgmt-do-csi-token
        property: token
