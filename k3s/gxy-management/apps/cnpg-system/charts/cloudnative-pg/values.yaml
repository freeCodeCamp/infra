# Floor: operator 1.29.1 — CVE-2026-44477 (CVSS 9.4) in the metrics exporter.

replicaCount: 1

config:
  data:
    INHERITED_ANNOTATIONS: "kubectl.kubernetes.io/*"

monitoring:
  podMonitorEnabled: false
  grafanaDashboard:
    create: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
