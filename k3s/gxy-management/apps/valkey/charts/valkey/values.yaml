# Default values for the valkey chart.
# Production overlay at ../../values.production.yaml.
# Secret credentials overlay at (sops) infra-secrets/k3s/gxy-management/valkey.values.yaml.enc.
# Consumed by `just release gxy-management valkey`.
#
# Layer order (lowest → highest precedence):
#   1. THIS FILE (chart defaults)
#   2. apps/valkey/values.production.yaml (production overlay — image pin, PVC size, non-secret env)
#   3. infra-secrets/k3s/gxy-management/valkey.values.yaml.enc (sops sealed — AUTH password only)

# ---------------------------------------------------------------------
# Namespace
# ---------------------------------------------------------------------
namespace: valkey

# ---------------------------------------------------------------------
# Image
# ---------------------------------------------------------------------
# Per Universe RUN-residency rule: pull from upstream valkey/valkey
# direct. NEVER through zot.management on this same galaxy.
image:
  repository: valkey/valkey
  tag: "8.1.7-alpine"
  pullPolicy: IfNotPresent

# StatefulSet replicas. Ruling 2026-09-11: stays 1.
#
# Do not raise this to 2. The chart has no replication wiring, and the
# `valkey` ClusterIP Service selects every pod by label, so two
# replicas are two independent servers behind one round-robin Service.
# The artemis deploy fence would split: MarkDeployFinalized writes to
# one pod and IsDeployFinalized reads the other and misses. That is a
# correctness regression, not HA.
#
# Real HA needs Sentinel plus a failover-aware client in artemis.
# Postgres is the registry source of truth after the 2026-09-11
# cutover, so Valkey now holds only the deploy fence, the GitHub team
# cache and the registry.changed channel. Sentinel is the wrong size
# for that. Revisit when one of those three becomes a source of truth.
replicaCount: 1

# ---------------------------------------------------------------------
# Workload sizing
# ---------------------------------------------------------------------
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

# ---------------------------------------------------------------------
# Persistence — PVC backing AOF. Sized for ~10k registry rows worst
# case; current load is ~11. local-path is k3s default storage class.
# ---------------------------------------------------------------------
persistence:
  enabled: true
  storageClass: "local-path"
  accessMode: ReadWriteOnce
  size: 1Gi

# ---------------------------------------------------------------------
# Service — ClusterIP only. Artemis (cross-namespace) connects via
# `valkey.valkey.svc.cluster.local:6379`. NetworkPolicy below
# restricts ingress to the artemis pod label set.
# ---------------------------------------------------------------------
service:
  type: ClusterIP
  port: 6379
  targetPort: 6379

# ---------------------------------------------------------------------
# Pod & container security context (PSS restricted-compliant; the
# valkey namespace runs PSS restricted — Valkey holds the artemis
# deploy fence and the GitHub team cache, so it merits the strictest
# pod security profile).
# ---------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ---------------------------------------------------------------------
# Valkey config (rendered into a ConfigMap, mounted at
# /etc/valkey/valkey.conf, passed via --config to valkey-server).
#
# AOF on (`appendonly yes`): RDB-only would lose up-to-60s of writes
# on crash. The registry rebuilds from Postgres, but the deploy fence
# does not, and a lost fence lets an in-flight permit overwrite a
# finished deploy. fsync everysec is the standard durability/perf
# balance.
#
# `protected-mode no` is safe here because:
#   1. NetworkPolicy locks ingress to the artemis pod label.
#   2. requirepass below is set from the sops secret (non-empty).
#   3. Service is ClusterIP only — no external listener.
#
# requirepass is materialized from the sops Secret at runtime via
# `--requirepass $VALKEY_PASSWORD` in the StatefulSet command — NOT
# baked into this ConfigMap so the value never lives in plaintext on
# disk.
# ---------------------------------------------------------------------
valkeyConfig: |
  bind 0.0.0.0 -::*
  port 6379
  protected-mode no
  appendonly yes
  appendfsync everysec
  appendfilename "appendonly.aof"
  dir /data
  save ""
  maxmemory-policy noeviction
  loglevel notice

# Required secret env keys — populated by sops overlay
# (infra-secrets/k3s/gxy-management/valkey.values.yaml.enc).
# Listed here as null so chart fail-fasts via `required` template
# helpers if the overlay is missing or incomplete.
secretEnv:
  VALKEY_PASSWORD: null

# ---------------------------------------------------------------------
# PodDisruptionBudget. Set minAvailable OR maxUnavailable, never both.
#
# Ruling 2026-09-11: single-replica Valkey uses `maxUnavailable: 1`,
# which reports disruptionsAllowed 1 and lets a node drain proceed.
# `minAvailable: 1` on one replica reports 0 and blocks every drain
# of the pinned node for good. After the artemis readyz ruling
# (artemis docs/design/0007-readyz-degradation.md) a Valkey outage no
# longer removes artemis from the load balancer, so the eviction is
# survivable and the permanent drain block is the larger harm.
# Switch back to minAvailable when real replication lands.
# ---------------------------------------------------------------------
pdb:
  enabled: true
  minAvailable: null
  maxUnavailable: 1

# ---------------------------------------------------------------------
# NetworkPolicy
# ---------------------------------------------------------------------
# Ingress is locked to pods carrying these labels. Match must agree
# with whatever artemis pods carry (chart writes labels via
# `_helpers.tpl` — selectorLabels include `app.kubernetes.io/name:
# artemis`). Update both sides if the artemis chart changes labels.
networkPolicy:
  enabled: true
  ingressFrom:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: artemis
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: artemis

# ---------------------------------------------------------------------
# Liveness / readiness — `valkey-cli -a $VALKEY_PASSWORD ping` exec
# probe. Returns PONG when the server is up; non-zero exit when
# down or auth fails.
# ---------------------------------------------------------------------
probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
