{{- if and .Values.networkPolicy.enabled .Values.postgresCluster.enabled .Values.pgLagWatch.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Release.Name }}-pg-lag-watch
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "artemis.labels" . | nindent 4 }}
    app.kubernetes.io/component: pg-lag-watch
spec:
  description: "artemis pg-lag-watch CronJob: SQL to the CloudNativePG primary and check-ins to Sentry"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: pg-lag-watch
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              {{- range .Values.oomWatch.sentryFqdnPatterns }}
              - matchPattern: {{ . | quote }}
              {{- end }}
              - matchName: "{{ .Release.Name }}-pg-rw.{{ .Values.namespace }}.svc.cluster.local"
              - matchPattern: "*.*.svc.cluster.local"
    - toFQDNs:
        {{- range .Values.oomWatch.sentryFqdnPatterns }}
        - matchPattern: {{ . | quote }}
        {{- end }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": {{ .Values.namespace }}
            "k8s:cnpg.io/cluster": {{ .Release.Name }}-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
{{- end }}
