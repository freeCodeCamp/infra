{{- if or (and .Values.postgres.enabled .Values.backup.enabled) (and .Values.postgresCluster.enabled .Values.pgBackup.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-backup-secret
  labels:
    {{- include "artemis.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
type: Opaque
stringData:
  # ADR-016:23 — a backup-only R2 token, scoped to the backup bucket.
  # The serve token in `-env-secret` must never reach it.
  R2_ENDPOINT:           {{ required ".Values.secretEnv.R2_BACKUP_ENDPOINT is required when a backup CronJob is enabled" .Values.secretEnv.R2_BACKUP_ENDPOINT | quote }}
  R2_ACCESS_KEY_ID:      {{ required ".Values.secretEnv.R2_BACKUP_ACCESS_KEY_ID is required when a backup CronJob is enabled" .Values.secretEnv.R2_BACKUP_ACCESS_KEY_ID | quote }}
  R2_SECRET_ACCESS_KEY:  {{ required ".Values.secretEnv.R2_BACKUP_SECRET_ACCESS_KEY is required when a backup CronJob is enabled" .Values.secretEnv.R2_BACKUP_SECRET_ACCESS_KEY | quote }}
{{- end }}
