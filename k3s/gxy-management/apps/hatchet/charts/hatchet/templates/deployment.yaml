apiVersion: apps/v1
kind: Deployment
metadata:
  name: hatchet-engine
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hatchet.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
spec:
  replicas: {{ .Values.engine.replicas }}
  # Required anti-affinity means a surge pod needs a node holding no
  # engine pod. The k8s defaults at 2 replicas are maxSurge 1 and
  # maxUnavailable 0, so a rollout would demand a third free node and
  # stall for progressDeadlineSeconds when one is cordoned. Replace
  # rather than surge: the engine is off the serving path.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      {{- include "hatchet.engineSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hatchet.engineSelectorLabels" . | nindent 8 }}
    spec:
      {{- if eq .Values.engine.antiAffinity "required" }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "hatchet.engineSelectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- else if eq .Values.engine.antiAffinity "preferred" }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "hatchet.engineSelectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      {{- else }}
      {{- fail (printf "engine.antiAffinity must be \"required\" or \"preferred\", got %q" .Values.engine.antiAffinity) }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: engine
          image: {{ .Values.images.engine }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: grpc
              containerPort: {{ .Values.engine.grpcPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.engine.healthPort }}
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-env-secret
                  key: DATABASE_URL
            # Binary default is 7070; the platform contract is 7077
            # (artemis netpol + HATCHET_ADDR + upstream release compose).
            - name: SERVER_GRPC_PORT
              value: {{ .Values.engine.grpcPort | quote }}
            - name: SERVER_GRPC_BIND_ADDRESS
              value: "0.0.0.0"
            - name: SERVER_GRPC_BROADCAST_ADDRESS
              value: "hatchet-engine.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.engine.grpcPort }}"
            # Plaintext gRPC intra-cluster; the artemis worker pairs
            # this with HATCHET_CLIENT_TLS_STRATEGY=none.
            - name: SERVER_GRPC_INSECURE
              value: "true"
            # PG-as-MQ: binary default is rabbitmq
            # (pkg/config/server/server.go MessageQueueConfigFile);
            # postgres is the supported single-store mode.
            - name: SERVER_MSGQUEUE_KIND
              value: postgres
            - name: SERVER_DEFAULT_ENGINE_VERSION
              value: V1
            # Default-on phone-home to https://security.hatchet.run —
            # egress CNP drops it (PG+DNS only); disable at source.
            - name: SERVER_SECURITY_CHECK_ENABLED
              value: "false"
            # "health" is INERT on v0.91.2 (run.go:161 vs :563) and kept only so a downgrade
            # to the V0 path still starts the probes. "all" routes to
            # runV1Config, where /live + /ready come from
            # Runtime.Healthcheck (SERVER_HEALTHCHECK, default true) and
            # not from this list. The HasService() exact-match rule that
            # once required the token applies to runV0Config only.
            - name: SERVER_SERVICES
              value: "all health"
            - name: SERVER_AUTH_COOKIE_DOMAIN
              value: "hatchet-engine.{{ .Values.namespace }}.svc.cluster.local"
            - name: SERVER_AUTH_COOKIE_INSECURE
              value: "true"
            - name: SERVER_URL
              value: "http://hatchet-engine.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.engine.healthPort }}"
            - name: SERVER_LOGGER_LEVEL
              value: warn
            - name: SERVER_LOGGER_FORMAT
              value: json
            - name: DATABASE_MAX_CONNS
              value: {{ .Values.engine.database.maxConns | quote }}
            - name: DATABASE_LOGGER_LEVEL
              value: warn
            - name: DATABASE_LOGGER_FORMAT
              value: json
          envFrom:
            # Generated by the quickstart job: SERVER_AUTH_COOKIE_SECRETS
            # + SERVER_ENCRYPTION_{MASTER,JWT_PRIVATE,JWT_PUBLIC}_KEYSET.
            - secretRef:
                name: {{ .Values.bootstrap.keysetSecretName }}
          startupProbe:
            httpGet:
              path: /live
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /live
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: {{ .Values.engine.livenessFailureThreshold }}
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.engine.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
