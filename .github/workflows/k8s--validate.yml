name: K8s -- Manifest Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: K8s -- Manifest Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin
          kubeconform -v

      - name: Validate K8s manifests
        run: |
          kubeconform \
            -summary \
            -output text \
            -strict \
            -ignore-missing-schemas \
            -kubernetes-version 1.32.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-filename-pattern 'kustomization\.yaml' \
            -ignore-filename-pattern '\.kubeconfig\.yaml' \
            -ignore-filename-pattern 'values(\.[^/]+)?\.yaml' \
            -ignore-filename-pattern '\.sample' \
            k3s/
