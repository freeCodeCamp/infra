name: Ansible CI Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    working-directory: "./ansible"

jobs:
  test:
    name: Ansible CI Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Ansible
        uses: ./.github/actions/setup-ansible

      - name: Validate Ansible Setup
        run: |
          source .venv/bin/activate
          ansible --version
          ansible-lint --version
          ansible-inventory --help >/dev/null
          echo "SUCCESS: All ansible commands working"

      - name: Lint Playbooks
        run: |
          source .venv/bin/activate
          ansible-lint

      - name: Syntax Check Playbooks
        run: |
          source .venv/bin/activate
          ansible-playbook --syntax-check -e variable_host=localhost play-*.yml

      # --syntax-check does not descend into a dynamic include_tasks, so the
      # NGINX finding logic is invisible to the step above. This runs the
      # shipped task file for real against stubbed unit states on localhost.
      - name: Unit Test the NGINX Finding Logic
        run: |
          source .venv/bin/activate
          # No -i: ansible.cfg does not enable the host_list plugin, so
          # `-i localhost,` cannot be parsed and the play runs on the implicit
          # localhost regardless. The flag was doing nothing but printing
          # three warnings.
          ansible-playbook --check tests/play-test--4-verify-nginx.yml

      - name: Unit Test the Disk Space Finding Logic
        run: |
          source .venv/bin/activate
          ansible-playbook --check tests/play-test--5-check-disk-space.yml

      - name: Unit Test the node_exporter Finding Logic
        run: |
          source .venv/bin/activate
          ansible-playbook --check tests/play-test--6-verify-node-exporter.yml
