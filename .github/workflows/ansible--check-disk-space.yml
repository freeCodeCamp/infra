name: Ansible --08- Check Disk Space

on:
  workflow_call:
    inputs:
      hosts:
        description: "The value for the variable_host argument"
        type: string
        required: true
      verbosity:
        description: "The verbosity level for logs"
        type: string
        default: "-v"
      threshold:
        description: "Percent of disk used that counts as a finding"
        type: number
        default: 80
      inode_threshold:
        description: "Percent of inodes used that counts as a finding"
        type: number
        default: 80
      provider:
        description: "The inventory to use: linode or vultr"
        type: string
        required: false
        default: "linode"
    secrets:
      SSH_PRIVATE_KEY:
        description: "The SSH private key for the Ansible user"
        required: true
      LINODE_TOKEN:
        description: "The Linode API token"
        required: true
      VULTR_API_KEY:
        description: "The Vultr API key"
        required: false
  workflow_dispatch:
    inputs:
      hosts:
        description: "The value for the variable_host argument"
        type: string
        required: true
        default: "none"
      verbosity:
        description: "The verbosity level for logs"
        type: choice
        required: true
        default: "-v"
        options:
          - "-v"
          - "-vv"
          - "-vvv"
      threshold:
        description: "Percent of disk used that counts as a finding"
        type: number
        required: true
        default: 80
      inode_threshold:
        description: "Percent of inodes used that counts as a finding"
        type: number
        required: true
        default: 80
      provider:
        description: "The inventory to use: linode or vultr"
        type: choice
        required: true
        default: "linode"
        options:
          - "linode"
          - "vultr"

defaults:
  run:
    working-directory: "./ansible"

jobs:
  run_playbook:
    name: Run Play
    runs-on: ubuntu-latest
    permissions: {}
    env:
      LINODE_API_TOKEN: ${{ secrets.LINODE_TOKEN }}
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Ansible
        uses: ./.github/actions/setup-ansible
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Play -- Check Disk Space
        env:
          HOSTS: ${{ inputs.hosts }}
          THRESHOLD: ${{ inputs.threshold }}
          INODE_THRESHOLD: ${{ inputs.inode_threshold }}
          VERBOSITY: ${{ inputs.verbosity }}
          PROVIDER: ${{ inputs.provider }}
        run: |
          source .venv/bin/activate
          case "$HOSTS" in
            '' | *[!A-Za-z0-9_,.:*!\&-]*)
              echo "::error::invalid host pattern -- letters, digits and _ , . : * ! & - only"
              exit 1
              ;;
          esac
          case "$PROVIDER" in
            linode) inventory=(-i inventory/linode.yml) ;;
            vultr)
              inventory=(-i inventory/vultr.yml -i inventory/constructed.yml)
              export ANSIBLE_HOST_PATTERN_MISMATCH=error
              ;;
            *)
              echo "::error::provider must be linode or vultr"
              exit 1
              ;;
          esac
          ansible-playbook "${inventory[@]}" \
          play-any--check-disk-space.yml \
          --private-key=~/.ssh/id_for_ansible.pem \
          -e variable_host="$HOSTS" \
          -e variable_disk_threshold="$THRESHOLD" \
          -e variable_inode_threshold="$INODE_THRESHOLD" \
          "$VERBOSITY"
