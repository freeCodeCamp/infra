name: Ansible --04- Uptime

on:
  workflow_call:
    inputs:
      hosts:
        description: 'The value for the variable_host argument'
        type: string
        required: true
      verbosity:
        description: 'The verbosity level for logs'
        type: string
      provider:
        description: 'The inventory to use: linode or vultr'
        type: string
        required: false
        default: 'linode'
    secrets:
      SSH_PRIVATE_KEY:
        description: 'The SSH private key for the Ansible user'
        required: true
      LINODE_TOKEN:
        description: 'The Linode API token'
        required: true
      VULTR_API_KEY:
        description: 'The Vultr API key'
        required: false
  workflow_dispatch:
    inputs:
      hosts:
        description: 'The value for the variable_host argument'
        type: string
        required: true
        default: 'none'
      verbosity:
        description: 'The verbosity level for logs'
        type: choice
        required: true
        default: '-v'
        options:
          - '-v'
          - '-vv'
          - '-vvv'
      provider:
        description: 'The inventory to use: linode or vultr'
        type: choice
        required: true
        default: 'linode'
        options:
          - 'linode'
          - 'vultr'

defaults:
  run:
    working-directory: './ansible'

jobs:
  run_playbook:
    name: Run Play
    runs-on: ubuntu-latest
    env:
      LINODE_API_TOKEN: ${{ secrets.LINODE_TOKEN }}
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Ansible
        uses: ./.github/actions/setup-ansible
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Play -- Uptime
        env:
          HOSTS: ${{ inputs.hosts }}
          VERBOSITY: ${{ inputs.verbosity }}
          PROVIDER: ${{ inputs.provider }}
        run: |
          source .venv/bin/activate
          case "$HOSTS" in
            '' | *[!A-Za-z0-9_,.:*!\&-]*)
              echo "::error::invalid host pattern -- letters, digits and _ , . : * ! & - only"
              exit 1
              ;;
          esac
          case "$VERBOSITY" in
            '' | -v | -vv | -vvv | -vvvv) ;;
            *)
              echo "::error::verbosity must be empty or -v to -vvvv"
              exit 1
              ;;
          esac
          extra_args=()
          if [ -n "$VERBOSITY" ]; then
            extra_args+=("$VERBOSITY")
          fi
          case "$PROVIDER" in
            linode) inventory=(-i inventory/linode.yml) ;;
            vultr) inventory=(-i inventory/vultr.yml -i inventory/constructed.yml) ;;
            *)
              echo "::error::provider must be linode or vultr"
              exit 1
              ;;
          esac
          ansible-playbook "${inventory[@]}" \
          play-any--uptime.yml \
          --private-key=~/.ssh/id_for_ansible.pem \
          -e variable_host="$HOSTS" \
          "${extra_args[@]}"
