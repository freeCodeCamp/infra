name: Ansible --04- Uptime

on:
  workflow_call:
    inputs:
      hosts:
        description: 'The value for the variable_host argument'
        type: string
        required: true
      verbosity:
        description: 'The verbosity level for logs'
        type: string
    secrets:
      SSH_PRIVATE_KEY:
        description: 'The SSH private key for the Ansible user'
        required: true
      LINODE_TOKEN:
        description: 'The Linode API token'
        required: true
  workflow_dispatch:
    inputs:
      hosts:
        description: 'The value for the variable_host argument'
        type: string
        required: true
        default: 'none'
      verbosity:
        description: 'The verbosity level for logs'
        type: choice
        required: true
        default: '-v'
        options:
          - '-v'
          - '-vv'
          - '-vvv'

defaults:
  run:
    working-directory: './ansible'

jobs:
  run_playbook:
    name: Run Play
    runs-on: ubuntu-latest
    env:
      LINODE_API_TOKEN: ${{ secrets.LINODE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Ansible
        uses: ./.github/actions/setup-ansible
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Play -- Uptime
        env:
          HOSTS: ${{ inputs.hosts }}
          VERBOSITY: ${{ inputs.verbosity }}
        run: |
          source .venv/bin/activate
          case "$HOSTS" in
            '' | *[!A-Za-z0-9_,.:*!\&-]*)
              echo "::error::invalid host pattern -- letters, digits and _ , . : * ! & - only"
              exit 1
              ;;
          esac
          case "$VERBOSITY" in
            '' | -v | -vv | -vvv | -vvvv) ;;
            *)
              echo "::error::verbosity must be empty or -v to -vvvv"
              exit 1
              ;;
          esac
          extra_args=()
          if [ -n "$VERBOSITY" ]; then
            extra_args+=("$VERBOSITY")
          fi
          ansible-playbook -i inventory/linode.yml \
          play-any--uptime.yml \
          --private-key=~/.ssh/id_for_ansible.pem \
          -e variable_host="$HOSTS" \
          "${extra_args[@]}"
