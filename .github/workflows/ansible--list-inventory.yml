name: Ansible --01- List Inventory

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'The inventory to use: linode or vultr'
        type: choice
        required: true
        default: 'vultr'
        options:
          - 'linode'
          - 'vultr'

defaults:
  run:
    working-directory: './ansible'

jobs:
  run_playbook:
    name: Run Play
    runs-on: ubuntu-latest
    env:
      LINODE_API_TOKEN: ${{ secrets.LINODE_TOKEN }}
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Ansible
        uses: ./.github/actions/setup-ansible
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: List Inventory
        env:
          PROVIDER: ${{ inputs.provider }}
        run: |
          source .venv/bin/activate
          case "$PROVIDER" in
            linode) inventory=(-i inventory/linode.yml) ;;
            vultr) inventory=(-i inventory/vultr.yml -i inventory/constructed.yml) ;;
            *)
              echo "::error::provider must be linode or vultr"
              exit 1
              ;;
          esac
          ansible-inventory "${inventory[@]}" --graph -v
