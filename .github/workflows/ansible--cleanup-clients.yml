name: Ansible --06- Cleanup Clients

on:
  schedule:
    - cron: '30 3 * * 0' # Run at 03:30 UTC every Sunday [maintenance window: 00:00-06:00 UTC]
  workflow_dispatch:
    inputs:
      verbosity:
        description: 'The verbosity level for logs'
        type: choice
        required: true
        default: '-v'
        options:
          - '-v'
          - '-vv'
          - '-vvv'
      serial:
        description: 'The value for the variable_serial argument'
        type: number
      dry_run:
        description: 'Run in dry-run mode to see what would be deleted'
        type: boolean
        required: true
        default: false
      provider:
        description: 'The inventory to use: linode or vultr'
        type: choice
        required: true
        default: 'linode'
        options:
          - 'linode'
          - 'vultr'

defaults:
  run:
    working-directory: './ansible'

jobs:
  run_playbook:
    name: Run Play
    runs-on: ubuntu-latest
    env:
      LINODE_API_TOKEN: ${{ secrets.LINODE_TOKEN }}
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
    strategy:
      matrix:
        host_groups:
          - 'prd_oldeworld_clt'
          - 'stg_oldeworld_clt'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Ansible
        uses: ./.github/actions/setup-ansible
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Play -- Cleanup Clients
        env:
          HOSTS: ${{ matrix.host_groups }}
          SERIAL: ${{ inputs.serial || 0 }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          VERBOSITY: ${{ inputs.verbosity }}
          PROVIDER: ${{ inputs.provider || 'linode' }}
        run: |
          source .venv/bin/activate
          case "$SERIAL" in
            '' | *[!0-9]*)
              echo "::error::serial must be a non-negative integer"
              exit 1
              ;;
          esac
          case "$DRY_RUN" in
            true | false) ;;
            *)
              echo "::error::dry_run must be true or false"
              exit 1
              ;;
          esac
          case "$VERBOSITY" in
            '' | -v | -vv | -vvv | -vvvv) ;;
            *)
              echo "::error::verbosity must be empty or -v to -vvvv"
              exit 1
              ;;
          esac
          extra_args=()
          if [ -n "$VERBOSITY" ]; then
            extra_args+=("$VERBOSITY")
          fi
          case "$PROVIDER" in
            linode) inventory=(-i inventory/linode.yml) ;;
            vultr) inventory=(-i inventory/vultr.yml -i inventory/constructed.yml) ;;
            *)
              echo "::error::provider must be linode or vultr"
              exit 1
              ;;
          esac
          ansible-playbook "${inventory[@]}" \
          play-any--cleanup-clients.yml \
          --private-key=~/.ssh/id_for_ansible.pem \
          -e variable_host="$HOSTS" \
          -e variable_serial="$SERIAL" \
          -e variable_dry_run="$DRY_RUN" \
          "${extra_args[@]}"
