name: Ansible --02- Houskeeping

on:
  workflow_dispatch:
    inputs:
      window_check:
        description: Refuse to run outside the maintenance window (Wed/Sat 00:00-06:00 UTC)
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  window:
    name: Maintenance Window
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Check the start time
        id: check
        env:
          WINDOW_CHECK: ${{ inputs.window_check }}
        run: |
          day=$(date -u +%u)
          hour=$(date -u +%H)
          allowed=false
          if [ "$WINDOW_CHECK" = "false" ]; then
            allowed=true
          elif { [ "$day" = 3 ] || [ "$day" = 6 ]; } && [ "${hour#0}" -lt 6 ]; then
            allowed=true
          fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          echo "started=$(date -u '+%a %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.check.outputs.allowed != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Post the refusal
        if: steps.check.outputs.allowed != 'true'
        uses: ./.github/actions/notify-chat
        with:
          webhook: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          status: warn
          source: housekeeping
          subject: window Wed/Sat 00:00-06:00 UTC
          summary: "REFUSED: started ${{ steps.check.outputs.started }}, nothing ran"
          details: dispatch with window_check=false to override

  uptime:
    name: Uptime
    needs: window
    if: needs.window.outputs.allowed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: ops_swarm_mgr, provider: vultr }
          - { group: ops_o11y_vultr, provider: vultr }
          - { group: stg_api, provider: vultr }
          - { group: prd_api, provider: vultr }
          - { group: stg_pxy, provider: vultr }
          - { group: prd_pxy, provider: vultr }
          - { group: stg_soc, provider: vultr }
          - { group: stg_nws, provider: vultr }
          - { group: prd_soc, provider: vultr }
          - { group: prd_nws, provider: vultr }
          - { group: stg_clt, provider: vultr }
          - { group: prd_clt_eng, provider: vultr }
          - { group: prd_clt_chn, provider: vultr }
          - { group: prd_clt_cnt, provider: vultr }
          - { group: prd_clt_esp, provider: vultr }
          - { group: prd_clt_ger, provider: vultr }
          - { group: prd_clt_ita, provider: vultr }
          - { group: prd_clt_jpn, provider: vultr }
          - { group: prd_clt_por, provider: vultr }
          - { group: prd_clt_ukr, provider: vultr }
          - { group: prd_clt_swa, provider: vultr }
          - { group: prd_clt_kor, provider: vultr }
          - { group: prd_clt_ara, provider: vultr }

    uses: ./.github/workflows/ansible--uptime.yml
    with:
      hosts: ${{ matrix.group }}
      verbosity: "-v"
      provider: ${{ matrix.provider }}
    secrets:
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  update-stg:
    name: Update (staging)
    needs: uptime
    strategy:
      fail-fast: false
      matrix:
        host_groups:
          - stg_api
          - stg_pxy
          - stg_soc
          - stg_nws
          - stg_clt
    uses: ./.github/workflows/ansible--update.yml
    with:
      hosts: ${{ matrix.host_groups }}
      verbosity: "-v"
      provider: vultr
      serial: 1
    secrets:
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  reboot-web-stg:
    name: Reboot Ingress (staging)
    needs: update-stg
    strategy:
      fail-fast: false
      matrix:
        host_groups:
          - stg_pxy
    uses: ./.github/workflows/ansible--reboot.yml
    with:
      hosts: ${{ matrix.host_groups }}
      verbosity: "-v"
      provider: vultr
      serial: 1
    secrets:
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  gate-web-stg:
    name: Gate NGINX (staging)
    needs: reboot-web-stg
    strategy:
      fail-fast: false
      matrix:
        host_groups:
          - stg_pxy
    uses: ./.github/workflows/ansible--verify-nginx.yml
    with:
      hosts: ${{ matrix.host_groups }}
      verbosity: "-v"
      provider: vultr
      stage: Gate NGINX (staging)
      artifact_prefix: nginx-gate
    secrets:
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}

  reboot-stg:
    name: Reboot (staging)
    needs: gate-web-stg
    strategy:
      fail-fast: false
      matrix:
        host_groups:
          - stg_api
          - stg_soc
          - stg_nws
          - stg_clt
    uses: ./.github/workflows/ansible--reboot.yml
    with:
      hosts: ${{ matrix.host_groups }}
      verbosity: "-v"
      provider: vultr
      serial: 1
    secrets:
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  gate-swarm-stg:
    name: Gate Swarm (staging)
    needs: reboot-stg
    uses: ./.github/workflows/ansible--verify-swarm.yml
    with:
      hosts: stg_api:stg_soc:stg_nws
      manager: ops_swarm_mgr
      service_prefix: stg-
      verbosity: "-v"
      provider: vultr
    secrets:
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  update-prd:
    name: Update (production)
    needs: gate-swarm-stg
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: ops_swarm_mgr, provider: vultr }
          - { group: ops_o11y_vultr, provider: vultr }
          - { group: prd_api, provider: vultr }
          - { group: prd_pxy, provider: vultr }
          - { group: prd_soc, provider: vultr }
          - { group: prd_nws, provider: vultr }
          - { group: prd_clt_eng, provider: vultr }
          - { group: prd_clt_chn, provider: vultr }
          - { group: prd_clt_cnt, provider: vultr }
          - { group: prd_clt_esp, provider: vultr }
          - { group: prd_clt_ger, provider: vultr }
          - { group: prd_clt_ita, provider: vultr }
          - { group: prd_clt_jpn, provider: vultr }
          - { group: prd_clt_por, provider: vultr }
          - { group: prd_clt_ukr, provider: vultr }
          - { group: prd_clt_swa, provider: vultr }
          - { group: prd_clt_kor, provider: vultr }
          - { group: prd_clt_ara, provider: vultr }
    uses: ./.github/workflows/ansible--update.yml
    with:
      hosts: ${{ matrix.group }}
      verbosity: "-v"
      provider: ${{ matrix.provider }}
      serial: 1
    secrets:
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  reboot-web-prd:
    name: Reboot Ingress (production)
    needs: update-prd
    strategy:
      fail-fast: false
      matrix:
        host_groups:
          - prd_pxy
    uses: ./.github/workflows/ansible--reboot.yml
    with:
      hosts: ${{ matrix.host_groups }}
      verbosity: "-v"
      provider: vultr
      serial: 1
    secrets:
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  gate-web-prd:
    name: Gate NGINX (production)
    needs: reboot-web-prd
    strategy:
      fail-fast: false
      matrix:
        host_groups:
          - prd_pxy
    uses: ./.github/workflows/ansible--verify-nginx.yml
    with:
      hosts: ${{ matrix.host_groups }}
      verbosity: "-v"
      provider: vultr
      stage: Gate NGINX (production)
      artifact_prefix: nginx-gate
    secrets:
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}

  reboot-prd:
    name: Reboot (production)
    needs: gate-web-prd
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: prd_api, provider: vultr }
          - { group: prd_soc, provider: vultr }
          - { group: prd_nws, provider: vultr }
          - { group: prd_clt_eng, provider: vultr }
          - { group: prd_clt_chn, provider: vultr }
          - { group: prd_clt_cnt, provider: vultr }
          - { group: prd_clt_esp, provider: vultr }
          - { group: prd_clt_ger, provider: vultr }
          - { group: prd_clt_ita, provider: vultr }
          - { group: prd_clt_jpn, provider: vultr }
          - { group: prd_clt_por, provider: vultr }
          - { group: prd_clt_ukr, provider: vultr }
          - { group: prd_clt_swa, provider: vultr }
          - { group: prd_clt_kor, provider: vultr }
          - { group: prd_clt_ara, provider: vultr }
    uses: ./.github/workflows/ansible--reboot.yml
    with:
      hosts: ${{ matrix.group }}
      verbosity: "-v"
      provider: ${{ matrix.provider }}
      serial: 1
    secrets:
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  reboot-mgr:
    name: Reboot (Swarm manager)
    needs: reboot-prd
    uses: ./.github/workflows/ansible--reboot.yml
    with:
      hosts: ops_swarm_mgr
      verbosity: "-v"
      provider: vultr
      serial: 1
    secrets:
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  reboot-o11y:
    name: Reboot (o11y K3s)
    needs: reboot-mgr
    uses: ./.github/workflows/ansible--reboot-k3s.yml
    with:
      hosts: ops_o11y_vultr
      verbosity: "-v"
      provider: vultr
    secrets:
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  # Terminal by design. Nothing runs after it, so a red verify can never stop
  # the fleet being patched -- which is the property the rest of this chain
  # does not have, since every other stage skips everything downstream when it
  # fails.
  #
  # Scoped to the ingress groups: NGINX exists on the 6 pxy hosts and nowhere
  # else in this fleet, so this is the only place where a missing NGINX is a
  # finding rather than a normal absence.
  verify-nginx:
    name: Verify NGINX
    needs: [window, reboot-prd, reboot-mgr]
    # This condition widens rather than narrows: it makes the check run even
    # when a stage above failed or was skipped, which is exactly when a
    # service is most likely to be down.
    if: ${{ !cancelled() && needs.window.outputs.allowed == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: stg_pxy, provider: vultr }
          - { group: prd_pxy, provider: vultr }

    uses: ./.github/workflows/ansible--verify-nginx.yml
    with:
      hosts: ${{ matrix.group }}
      verbosity: "-v"
      provider: ${{ matrix.provider }}
      stage: Verify NGINX
    secrets:
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}

  verify-swarm:
    name: Verify Swarm
    needs: [window, reboot-prd, reboot-mgr]
    if: ${{ !cancelled() && needs.window.outputs.allowed == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              hosts: "stg_api:stg_soc:stg_nws:prd_api:prd_soc:prd_nws:ops_swarm_mgr",
              manager: ops_swarm_mgr,
              provider: vultr,
            }
    uses: ./.github/workflows/ansible--verify-swarm.yml
    with:
      hosts: ${{ matrix.hosts }}
      manager: ${{ matrix.manager }}
      verbosity: "-v"
      provider: ${{ matrix.provider }}
    secrets:
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  report:
    name: Report
    needs:
      [
        window,
        uptime,
        update-stg,
        reboot-web-stg,
        gate-web-stg,
        reboot-stg,
        gate-swarm-stg,
        update-prd,
        reboot-web-prd,
        gate-web-prd,
        reboot-prd,
        reboot-mgr,
        reboot-o11y,
        verify-nginx,
        verify-swarm,
      ]
    # always(), not success(): the run that most needs a message is the one
    # that failed. Once this posts on every run, a Wednesday or Saturday with
    # NO message means the workflow never ran at all -- the one failure no
    # in-workflow check can catch, because a workflow that does not run cannot
    # report on itself.
    if: ${{ always() && (needs.window.result != 'success' || needs.window.outputs.allowed == 'true') }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Job outputs cannot carry per-host detail out of a matrix job -- the
      # legs overwrite each other. Each verify leg uploads its findings, and
      # they are collected here.
      - name: Collect the NGINX findings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: nginx-verify-*
          path: findings

      - name: Build the run summary
        id: summary
        env:
          WINDOW: ${{ needs.window.result }}
          UPTIME: ${{ needs.uptime.result }}
          UPDATE_STG: ${{ needs.update-stg.result }}
          REBOOT_WEB_STG: ${{ needs.reboot-web-stg.result }}
          GATE_WEB_STG: ${{ needs.gate-web-stg.result }}
          REBOOT_STG: ${{ needs.reboot-stg.result }}
          GATE_SWARM_STG: ${{ needs.gate-swarm-stg.result }}
          UPDATE_PRD: ${{ needs.update-prd.result }}
          REBOOT_WEB_PRD: ${{ needs.reboot-web-prd.result }}
          GATE_WEB_PRD: ${{ needs.gate-web-prd.result }}
          REBOOT_PRD: ${{ needs.reboot-prd.result }}
          REBOOT_MGR: ${{ needs.reboot-mgr.result }}
          REBOOT_O11Y: ${{ needs.reboot-o11y.result }}
          VERIFY: ${{ needs.verify-nginx.result }}
          VERIFY_SWARM: ${{ needs.verify-swarm.result }}
        run: |
          python3 - <<'PYEOF'
          import glob, json, os
          from datetime import datetime, timezone

          stages = [
              ("window", os.environ["WINDOW"]),
              ("uptime", os.environ["UPTIME"]),
              ("update-stg", os.environ["UPDATE_STG"]),
              ("reboot-web-stg", os.environ["REBOOT_WEB_STG"]),
              ("gate-web-stg", os.environ["GATE_WEB_STG"]),
              ("reboot-stg", os.environ["REBOOT_STG"]),
              ("gate-swarm-stg", os.environ["GATE_SWARM_STG"]),
              ("update-prd", os.environ["UPDATE_PRD"]),
              ("reboot-web-prd", os.environ["REBOOT_WEB_PRD"]),
              ("gate-web-prd", os.environ["GATE_WEB_PRD"]),
              ("reboot-prd", os.environ["REBOOT_PRD"]),
              ("reboot-mgr", os.environ["REBOOT_MGR"]),
              ("reboot-o11y", os.environ["REBOOT_O11Y"]),
              ("verify", os.environ["VERIFY"]),
              ("verify-swarm", os.environ["VERIFY_SWARM"]),
          ]

          checked, bad = 0, []
          for path in sorted(glob.glob("findings/*/nginx-verify.json")):
              try:
                  report = json.load(open(path))
              except (OSError, ValueError):
                  continue
              for f in report.get("findings") or []:
                  checked += 1
                  if f.get("reasons"):
                      bad.append(f)

          # A skipped stage is not a passing one. Under this chain a failed
          # update skips every reboot stage, and a tick would hide that.
          if any(r == "failure" for _, r in stages) or bad:
              verdict, status = "ANOMALY", "fail"
          elif any(r == "cancelled" for _, r in stages):
              verdict, status = "CANCELLED", "warn"
          elif any(r == "skipped" for _, r in stages):
              verdict, status = "INCOMPLETE", "warn"
          else:
              verdict, status = "OK", "ok"

          if bad:
              nginx = f"nginx anomaly on {len(bad)}/{checked} pxy hosts"
          elif checked:
              nginx = f"nginx active and enabled on {checked}/{checked} pxy hosts"
          else:
              nginx = "no nginx findings collected"
          off = [f"{name} {result}" for name, result in stages if result != "success"]
          summary = f"{verdict}: " + "; ".join([nginx] + off)
          subject = datetime.now(timezone.utc).strftime("%a %d %b")

          details = []
          for f in bad:
              details.append(f["host"])
              details += [f"  {r}" for r in f["reasons"]]
          details.append("stages")
          details += [f"  {name:<16}{result}" for name, result in stages]

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"status={status}\n")
              out.write(f"subject={subject}\n")
              out.write(f"summary={summary}\n")
              out.write("details<<REPORT_EOF\n")
              out.write("\n".join(details) + "\n")
              out.write("REPORT_EOF\n")
          print(summary)
          print("\n".join(details))
          PYEOF

      - name: Post the run summary
        uses: ./.github/actions/notify-chat
        with:
          webhook: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          status: ${{ steps.summary.outputs.status }}
          source: housekeeping
          subject: ${{ steps.summary.outputs.subject }}
          summary: ${{ steps.summary.outputs.summary }}
          details: ${{ steps.summary.outputs.details }}
