name: Notify DevOps Alerts
description: >-
  Send a signed structured event to the DevOps Alerts proxy. Notification
  failures never change the reporting workflow's result.

inputs:
  endpoint:
    description: "Versioned DevOps Alerts proxy endpoint."
    required: false
    default: ""
  hmac_secret:
    description: "GitHub-only HMAC credential for the proxy route."
    required: false
    default: ""
  notification_key:
    description: "Stable logical notification key within this run and attempt."
    required: true
  status:
    description: "ok, warn or fail."
    required: true
  source:
    description: "The reporting system, for example housekeeping."
    required: true
  subject:
    description: "What the event is about."
    required: true
  summary:
    description: "A concise verdict and reason."
    required: true
  details:
    description: "Optional detail lines for warning or failure events."
    required: false
    default: ""
  link:
    description: "HTTPS target. Defaults to this workflow run."
    required: false
    default: ""
  link_label:
    description: "Text for the trailing link."
    required: false
    default: "run"

runs:
  using: composite
  steps:
    - name: Notify DevOps Alerts
      shell: bash
      env:
        PROXY_ENDPOINT: ${{ inputs.endpoint }}
        HMAC_SECRET: ${{ inputs.hmac_secret }}
        NOTIFICATION_KEY: ${{ inputs.notification_key }}
        STATUS: ${{ inputs.status }}
        SOURCE: ${{ inputs.source }}
        SUBJECT: ${{ inputs.subject }}
        SUMMARY: ${{ inputs.summary }}
        DETAILS: ${{ inputs.details }}
        LINK: ${{ inputs.link }}
        LINK_LABEL: ${{ inputs.link_label }}
      run: bash "$GITHUB_ACTION_PATH/notify.sh"
