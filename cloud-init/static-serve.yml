#cloud-config
package_update: true
package_upgrade: true
package_reboot_if_required: true
packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg-agent
  - software-properties-common
  - lsb-release
  - fail2ban
users:
  - name: freecodecamp
    groups:
      - sudo
      - docker
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_import_id:
      - gh:camperbot
      - gh:raisedadead
write_files:
  - path: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      port = ssh
      filter = sshd
      maxretry = 5
      bantime = 3600
      findtime = 600
    owner: root:root
    permissions: "0644"
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      AllowUsers freecodecamp
    owner: root:root
    permissions: "0644"
  - path: /etc/caddy-s3/Caddyfile
    content: |
      {
        auto_https off
        # Loopback-only admin API.
        admin 127.0.0.1:2019

        order r2_alias before file_server

        metrics

        filesystem r2 r2 {
          bucket            {env.R2_BUCKET}
          endpoint          {env.R2_ENDPOINT}
          region            auto
          access_key_id     {env.AWS_ACCESS_KEY_ID}
          secret_access_key {env.AWS_SECRET_ACCESS_KEY}
          use_path_style
          max_file_size        33554432
          max_in_flight_bytes  100663296
          # Code defaults, not set here. Truth lives in the named constants in
          # caddy-r2alias/filesystem.go.
          #   (no knob)      30s      opTimeout, bounds every S3 round trip
        }
      }

      :9180 {
        metrics /metrics
      }

      :80 {
        log {
          output stdout
          format json
        }

        @apex host freecode.camp www.freecode.camp freecode.camp. www.freecode.camp.
        handle @apex {
          redir https://www.freecodecamp.org{uri} 302
        }

        handle /healthz {
          respond "ok" 200
        }

        handle {
          # https://developers.cloudflare.com/cache/concepts/cache-control/
          # s-maxage drives the edge; max-age=0 keeps the browser revalidating.
          @hashed path_regexp ^/(assets|_astro|_next/static|static/(js|css|media))/.*[.-][A-Za-z0-9_-]{8,}\.(js|css|woff2?|ttf|otf|png|jpe?g|gif|svg|webp|avif|ico|map|wasm)$
          @unhashed not path_regexp ^/(assets|_astro|_next/static|static/(js|css|media))/.*[.-][A-Za-z0-9_-]{8,}\.(js|css|woff2?|ttf|otf|png|jpe?g|gif|svg|webp|avif|ico|map|wasm)$
          header @hashed   Cache-Control "public, max-age=31536000, immutable"
          header @unhashed Cache-Control "public, max-age=0, s-maxage=86400, must-revalidate"

          r2_alias {
            bucket            {env.R2_BUCKET}
            endpoint          {env.R2_ENDPOINT}
            region            auto
            access_key_id     {env.AWS_ACCESS_KEY_ID}
            secret_access_key {env.AWS_SECRET_ACCESS_KEY}
            cache_ttl         15s
            cache_max_entries 10000
            # Code defaults, not set here. Truth lives in the named constants in
            # caddy-r2alias/r2alias.go; grep them before trusting these numbers.
            #   fetch_timeout    2s                      defaultFetchTimeout
            #   deploy_id_regex  ^[A-Za-z0-9._-]{1,64}$  defaultDeployIDRegex
            # These are comments, not directives. An image that predates a
            # directive refuses to start and takes every site down.
            preview_subdomain "preview"
            root_domain       "freecode.camp"
          }

          file_server {
            fs r2
          }
        }

        handle_errors {
          header Cache-Control "no-store"
          header -Etag

          @404 expression {err.status_code} == 404
          respond @404 "Not Found" 404

          @400 expression {err.status_code} == 400
          respond @400 "Bad Request" 400

          @405 expression {err.status_code} == 405
          respond @405 "Method Not Allowed" 405

          @503 expression {err.status_code} == 503
          respond @503 "Service Unavailable" 503

          respond "Server Error" 500
        }
      }
    owner: root:root
    permissions: "0644"
  - path: /etc/systemd/system/caddy-s3.service
    content: |
      [Unit]
      Description=caddy-s3 static serve for *.freecode.camp
      After=docker.service network-online.target
      Requires=docker.service
      ConditionPathExists=/etc/caddy-s3/r2.env

      [Service]
      Restart=always
      RestartSec=5
      ExecStartPre=-/usr/bin/docker rm -f caddy-s3
      ExecStart=/usr/bin/docker run --rm --name caddy-s3 \
        --publish 80:80 \
        --log-opt max-size=50m --log-opt max-file=3 \
        --user 1000:1000 \
        --read-only \
        --cap-drop ALL --cap-add NET_BIND_SERVICE \
        --security-opt no-new-privileges \
        --memory 512m \
        --tmpfs /data:uid=1000,gid=1000 \
        --tmpfs /config:uid=1000,gid=1000 \
        --env GOMEMLIMIT=400MiB \
        --env R2_BUCKET=universe-static-apps-weur \
        --env-file /etc/caddy-s3/r2.env \
        --volume /etc/caddy-s3/Caddyfile:/etc/caddy/Caddyfile:ro \
        ghcr.io/freecodecamp/caddy-s3@sha256:9501221230d55df7787c58fe9722b48a99749febfe1d822c9a2f27fdf790e894 \
        caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
      ExecStop=/usr/bin/docker stop caddy-s3

      [Install]
      WantedBy=multi-user.target
    owner: root:root
    permissions: "0644"
runcmd:
  - sudo mkdir -p /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor
    -o /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture)
    signed-by=/etc/apt/keyrings/docker.gpg]
    https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo
    tee /etc/apt/sources.list.d/docker.list > /dev/null
  - sudo apt-get update -y
  - sudo apt-get install -y docker-ce docker-ce-cli containerd.io
    docker-compose-plugin
  - sudo systemctl start docker
  - sudo systemctl enable docker
  - sudo usermod -aG docker freecodecamp
  - docker pull ghcr.io/freecodecamp/caddy-s3@sha256:9501221230d55df7787c58fe9722b48a99749febfe1d822c9a2f27fdf790e894
  - systemctl daemon-reload
  - systemctl enable caddy-s3
  - systemctl enable fail2ban
  - systemctl start fail2ban
  # :-----------------------: WARNING :-----------------------:
  #
  #   This next line should be the last command in the list,
  #   because it involves restarting the ssh service.
  #
  # :-----------------------: WARNING :-----------------------:
  - systemctl restart ssh || systemctl restart sshd || true
final_message: "Setup complete"
