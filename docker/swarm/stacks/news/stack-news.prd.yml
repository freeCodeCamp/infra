services:
  svc-eng:
    image: ${DOCKER_REGISTRY}/${DEPLOYMENT_ENV}/news-english:latest
    ports:
      - published: ${NEWS_ENG_PUBLISHED_PORT:-4001}
        target: 3000
        protocol: tcp
        mode: ${NEWS_PUBLISH_MODE:-host}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
      start_interval: 2s
    deploy:
      replicas: 3
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.labels.jms.enabled == true
          - node.labels.jms.variant == ${DEPLOYMENT_ENV}
        preferences:
          - spread: node.labels.jms.variant == ${DEPLOYMENT_ENV}
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      labels:
        - org.freecodecamp.autoupdate=true

networks:
  default:
    driver: overlay
    driver_opts:
      com.docker.network.driver.mtu: "1450"
