x-deploy-config: &deploy-config
  deploy:
    replicas: 3
    placement:
      max_replicas_per_node: 1
      constraints:
        - node.labels.jms.enabled == true
        - node.labels.jms.variant == ${DEPLOYMENT_ENV}
      preferences:
        - spread: node.labels.jms.variant == ${DEPLOYMENT_ENV}
    update_config:
      parallelism: 1
      delay: 10s
      failure_action: rollback
    labels:
      - org.freecodecamp.autoupdate=true

x-health-config: &health-config
  healthcheck:
    test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 15s
    start_interval: 2s

x-port-config: &port-config
  target: 3000
  protocol: tcp
  mode: ${NEWS_PUBLISH_MODE:-host}

services:
  # The following services are the news services for various languages.
  # The PORTS are important, as they are defined in the downstream NGINX configuration.
  svc-chn:
    image: ${DOCKER_REGISTRY}/${DEPLOYMENT_ENV}/news-chinese:latest
    ports:
      - published: ${NEWS_CHN_PUBLISHED_PORT:-4002}
        <<: *port-config
    <<: [*deploy-config, *health-config]
  svc-esp:
    image: ${DOCKER_REGISTRY}/${DEPLOYMENT_ENV}/news-espanol:latest
    ports:
      - published: ${NEWS_ESP_PUBLISHED_PORT:-4003}
        <<: *port-config
    <<: [*deploy-config, *health-config]
  svc-ita:
    image: ${DOCKER_REGISTRY}/${DEPLOYMENT_ENV}/news-italian:latest
    ports:
      - published: ${NEWS_ITA_PUBLISHED_PORT:-4004}
        <<: *port-config
    <<: [*deploy-config, *health-config]
  svc-jpn:
    image: ${DOCKER_REGISTRY}/${DEPLOYMENT_ENV}/news-japanese:latest
    ports:
      - published: ${NEWS_JPN_PUBLISHED_PORT:-4005}
        <<: *port-config
    <<: [*deploy-config, *health-config]
  svc-kor:
    image: ${DOCKER_REGISTRY}/${DEPLOYMENT_ENV}/news-korean:latest
    ports:
      - published: ${NEWS_KOR_PUBLISHED_PORT:-4006}
        <<: *port-config
    <<: [*deploy-config, *health-config]
  svc-por:
    image: ${DOCKER_REGISTRY}/${DEPLOYMENT_ENV}/news-portuguese:latest
    ports:
      - published: ${NEWS_POR_PUBLISHED_PORT:-4007}
        <<: *port-config
    <<: [*deploy-config, *health-config]
  svc-ukr:
    image: ${DOCKER_REGISTRY}/${DEPLOYMENT_ENV}/news-ukrainian:latest
    ports:
      - published: ${NEWS_UKR_PUBLISHED_PORT:-4008}
        <<: *port-config
    <<: [*deploy-config, *health-config]

networks:
  default:
    driver: overlay
    driver_opts:
      com.docker.network.driver.mtu: "1450"
