x-logging-config: &logging-config
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      compress: "true"

x-dispatch-env: &dispatch-env
  GITHUB_DISPATCH_TOKEN: ${GITHUB_DISPATCH_TOKEN}
  CHAT_PROXY_URL: http://svc-chat-proxy:8080/hooks/chat
  GITHUB_DISPATCH_TOKEN: ${GITHUB_DISPATCH_TOKEN:?}
  GOOGLE_CHAT_WEBHOOK: ${GOOGLE_CHAT_WEBHOOK:?}

x-dispatch: &dispatch
  <<: *logging-config
  image: curlimages/curl:8.23.0
  entrypoint: ["/scripts/dispatch.sh"]
  configs:
    - source: scripts_lib
      target: /scripts/lib.sh
      mode: 0444
    - source: scripts_dispatch
      target: /scripts/dispatch.sh
      mode: 0555

x-job-deploy: &job-deploy
  mode: replicated
  replicas: 0
  restart_policy:
    condition: none
  placement:
    constraints:
      - "node.role == manager"

services:
  svc-dispatch-news-eng:
    <<: *dispatch
    environment:
      <<: *dispatch-env
      DISPATCH_REPO: freeCodeCamp/news
      DISPATCH_WORKFLOW: deploy-eng.yml
      WINDOW_POLICY: avoid
    deploy:
      <<: *job-deploy
      labels:
        - "swarm.cronjob.enable=true"
        - "swarm.cronjob.replicas=1"
        - "swarm.cronjob.schedule=0 5 */3 * * *"
        - "swarm.cronjob.skip-running=true"

  svc-dispatch-housekeeping:
    <<: *dispatch
    environment:
      <<: *dispatch-env
      DISPATCH_REPO: freeCodeCamp/infra
      DISPATCH_WORKFLOW: ansible--housekeeping.yml
      WINDOW_POLICY: require
    deploy:
      <<: *job-deploy
      labels:
        - "swarm.cronjob.enable=true"
        - "swarm.cronjob.replicas=1"
        - "swarm.cronjob.schedule=0 30 1 * * 3,6"
        - "swarm.cronjob.skip-running=true"

  svc-dispatch-docr-gc:
    <<: *dispatch
    environment:
      <<: *dispatch-env
      DISPATCH_REPO: freeCodeCamp/infra
      DISPATCH_WORKFLOW: docr--garbage-collection.yml
      WINDOW_POLICY: require
    deploy:
      <<: *job-deploy
      labels:
        - "swarm.cronjob.enable=true"
        - "swarm.cronjob.replicas=1"
        - "swarm.cronjob.schedule=0 30 3 * * 3,6"
        - "swarm.cronjob.skip-running=true"

  svc-watchdog-news:
    <<: *logging-config
    image: curlimages/curl:8.23.0
    entrypoint: ["/scripts/watchdog.sh"]
    environment:
      CHAT_PROXY_URL: http://svc-chat-proxy:8080/hooks/chat
      GOOGLE_CHAT_WEBHOOK: ${GOOGLE_CHAT_WEBHOOK:?}
    configs:
      - source: scripts_lib
        target: /scripts/lib.sh
        mode: 0444
      - source: scripts_watchdog
        target: /scripts/watchdog.sh
        mode: 0555
    deploy:
      <<: *job-deploy
      labels:
        - "swarm.cronjob.enable=true"
        - "swarm.cronjob.replicas=1"
        - "swarm.cronjob.schedule=0 50 * * * *"
        - "swarm.cronjob.skip-running=true"

  svc-cronjob:
    image: crazymax/swarm-cronjob:1.16.1
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    environment:
      - "TZ=UTC"
      - "LOG_LEVEL=info"
      - "LOG_JSON=true"
    <<: *logging-config
    deploy:
      placement:
        constraints:
          - "node.role == manager"

  svc-update:
    image: shizunge/gantry:2026.0415.1
    environment:
      - "TZ=UTC"
      - "GANTRY_NODE_NAME={{.Node.Hostname}}"
      - "GANTRY_SLEEP_SECONDS=0"
      - "GANTRY_LOG_LEVEL=INFO"
      - "GANTRY_SERVICES_FILTERS=label=org.freecodecamp.autoupdate"
      - "GANTRY_SERVICES_EXCLUDED_FILTERS=name=stg-news"
      - "GANTRY_UPDATE_NUM_WORKERS=3"
      - "GANTRY_MANIFEST_NUM_WORKERS=5"
      - "GANTRY_MANIFEST_CMD=buildx"
      - "GANTRY_CLEANUP_IMAGES=true"
      - "GANTRY_ROLLBACK_ON_FAILURE=true"
      - "GANTRY_UPDATE_TIMEOUT_SECONDS=300"
      - "GANTRY_UPDATE_OPTIONS=--with-registry-auth"
      - "GANTRY_NOTIFICATION_APPRISE_URL=http://svc-chat-relay:9000/hooks/gantry?trigger=hourly"
      - "GANTRY_NOTIFICATION_CONDITION=all"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/home/freecodecamp/.docker:/root/.docker"
    <<: *logging-config
    deploy:
      mode: replicated
      replicas: 0
      restart_policy:
        condition: none
      labels:
        - "swarm.cronjob.enable=true"
        - "swarm.cronjob.replicas=1"
        # Fire every hour, on the 45th minute mark
        - "swarm.cronjob.schedule=0 45 0/1 * * *"
        # Fire every 1 minute -- for testing
        # - "swarm.cronjob.schedule=* * * * *"
        - "swarm.cronjob.skip-running=true"
      placement:
        constraints:
          - "node.role == manager"

  # Runs as a backup to Gantry's automatic cleanup
  svc-cleanup:
    image: docker:29.9.2
    command:
      - "docker"
      - "system"
      - "prune"
      - "-f"
      - "--filter"
      - "until=168h"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    <<: *logging-config
    deploy:
      mode: global
      labels:
        - "swarm.cronjob.enable=true"
        # Fire every Monday at 03:30 UTC
        - "swarm.cronjob.schedule=0 30 3 * * 1"
        - "swarm.cronjob.skip-running=false"
      restart_policy:
        condition: none

  svc-chat-proxy:
    image: python:3.12.15-alpine3.24@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    command: ["python3", "/app/chat_proxy.py"]
    environment:
      GOOGLE_CHAT_WEBHOOK_FILE: /run/secrets/google_chat_webhook
      GITHUB_ACTIONS_HMAC_SECRET_FILE: /run/secrets/github_actions_hmac
      GITHUB_ACTIONS_HMAC_SECRET_PREVIOUS_FILE: /run/secrets/github_actions_hmac_previous
      GITHUB_ACTIONS_REQUIRED: "true"
      GITHUB_ACTIONS_SIGNATURE_TTL_SECONDS: "300"
      GRAFANA_HMAC_SECRET_FILE: /run/secrets/grafana_hmac
      GRAFANA_HMAC_SECRET_PREVIOUS_FILE: /run/secrets/grafana_hmac_previous
      GRAFANA_REQUIRED: "true"
      GRAFANA_SIGNATURE_TTL_SECONDS: "300"
      CHAT_PROXY_EXPECTATIONS: /app/cron-expectations.json
      CHAT_PROXY_DATA_DIR: /data
      CHAT_PROXY_GRACE_MINUTES: "15"
      CHAT_PROXY_RETENTION_DAYS: "30"
      CHAT_PROXY_MAX_QUEUE_DEPTH: "10000"
      CHAT_PROXY_MIN_FREE_BYTES: "67108864"
      PORT: "8080"
      EXTERNAL_PORT: "8081"
    configs:
      - source: chat_proxy_script
        target: /app/chat_proxy.py
        mode: 0555
      - source: chat_proxy_expectations
        target: /app/cron-expectations.json
        mode: 0444
    secrets:
      - source: chat_proxy_google_chat_webhook
        target: google_chat_webhook
        mode: 0400
      - source: chat_proxy_github_actions_hmac
        target: github_actions_hmac
        mode: 0400
      - source: chat_proxy_github_actions_hmac_previous
        target: github_actions_hmac_previous
        mode: 0400
      - source: chat_proxy_grafana_hmac
        target: grafana_hmac
        mode: 0400
      - source: chat_proxy_grafana_hmac_previous
        target: grafana_hmac_previous
        mode: 0400
    volumes:
      - chat_proxy_data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 45s
    <<: *logging-config
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - "node.role == manager"
          - "node.labels.chat_proxy_data == true"

  svc-chat-relay:
    image: lwlook/webhook@sha256:93f708c6c0d6469b4a0f7f654d5f25054e54dccba1cf316a1d7e48e2be736c9a
    command:
      - "-verbose"
      - "-hooks=/hooks.json"
    environment:
      - "CHAT_PROXY_URL=http://svc-chat-proxy:8080/hooks/chat"
      - "GOOGLE_CHAT_WEBHOOK=${GOOGLE_CHAT_WEBHOOK:?}"
    configs:
      - source: hooks_relay
        target: /hooks.json
      - source: scripts_lib
        target: /scripts/lib.sh
        mode: 0444
      - source: scripts_relay
        target: /scripts/relay.sh
        mode: 0555
    <<: *logging-config
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - "node.role == manager"

  svc-webhook:
    image: lwlook/webhook@sha256:93f708c6c0d6469b4a0f7f654d5f25054e54dccba1cf316a1d7e48e2be736c9a
    command:
      - "-verbose"
      - "-hooks=/hooks.json"
      - "-hotreload"
      - "-template"
    ports:
      - published: 9889
        target: 9000
        protocol: tcp
        mode: host
    configs:
      - source: hooks_json
        target: /hooks.json
      - source: run_gantry
        target: /run_gantry.sh
        mode: 0550
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/home/freecodecamp/.docker:/root/.docker"
    environment:
      - "WEBHOOK_SECRET=${WEBHOOK_SECRET:?}"
    <<: *logging-config
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - "node.role == manager"

configs:
  hooks_json:
    file: ./hooks.json
  run_gantry:
    name: oncall_run_gantry_v2
    file: ./run_gantry.sh
  scripts_lib:
    name: oncall_scripts_lib_v2
    file: ./scripts/lib.sh
  scripts_dispatch:
    name: oncall_scripts_dispatch_v3
    file: ./scripts/dispatch.sh
  scripts_watchdog:
    name: oncall_scripts_watchdog_v2
    file: ./scripts/watchdog.sh
  hooks_relay:
    name: oncall_hooks_relay_v1
    file: ./hooks-relay.json
  scripts_relay:
    name: oncall_scripts_relay_v1
    file: ./scripts/relay.sh
  chat_proxy_script:
    name: oncall_chat_proxy_script_v4
    file: ./proxy/chat_proxy.py
  chat_proxy_expectations:
    name: oncall_chat_proxy_expectations_v1
    file: ./proxy/cron-expectations.json

secrets:
  chat_proxy_google_chat_webhook:
    external: true
    name: oncall_google_chat_webhook_v1
  chat_proxy_github_actions_hmac:
    external: true
    name: oncall_github_actions_hmac_v1
  chat_proxy_github_actions_hmac_previous:
    external: true
    name: oncall_github_actions_hmac_previous_v1
  chat_proxy_grafana_hmac:
    external: true
    name: oncall_grafana_hmac_v1
  chat_proxy_grafana_hmac_previous:
    external: true
    name: oncall_grafana_hmac_previous_v1

volumes:
  chat_proxy_data:
