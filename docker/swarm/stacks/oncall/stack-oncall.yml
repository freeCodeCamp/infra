x-logging-config: &logging-config
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      compress: "true"

x-dispatch-env: &dispatch-env
  GITHUB_DISPATCH_TOKEN: ${GITHUB_DISPATCH_TOKEN}
  GOOGLE_CHAT_WEBHOOK: ${GOOGLE_CHAT_WEBHOOK}

x-dispatch: &dispatch
  <<: *logging-config
  image: curlimages/curl:8.22.0
  entrypoint: ["/scripts/dispatch.sh"]
  configs:
    - source: scripts_lib
      target: /scripts/lib.sh
      mode: 0444
    - source: scripts_dispatch
      target: /scripts/dispatch.sh
      mode: 0555

x-dispatch-deploy: &dispatch-deploy
  mode: replicated
  replicas: 0
  restart_policy:
    condition: none
  placement:
    constraints:
      - "node.role == manager"

services:
  svc-dispatch-news-eng:
    <<: *dispatch
    environment:
      <<: *dispatch-env
      DISPATCH_REPO: freeCodeCamp/news
      DISPATCH_WORKFLOW: deploy-eng.yml
      WINDOW_POLICY: avoid
    deploy:
      <<: *dispatch-deploy
      labels:
        - "swarm.cronjob.enable=true"
        - "swarm.cronjob.replicas=1"
        - "swarm.cronjob.schedule=0 5 */3 * * *"
        - "swarm.cronjob.skip-running=true"

  svc-dispatch-news-i18n:
    <<: *dispatch
    environment:
      <<: *dispatch-env
      DISPATCH_REPO: freeCodeCamp/news
      DISPATCH_WORKFLOW: deploy-i18n.yml
      WINDOW_POLICY: avoid
    deploy:
      <<: *dispatch-deploy
      labels:
        - "swarm.cronjob.enable=true"
        - "swarm.cronjob.replicas=1"
        - "swarm.cronjob.schedule=0 5 */6 * * *"
        - "swarm.cronjob.skip-running=true"

  svc-dispatch-housekeeping:
    <<: *dispatch
    environment:
      <<: *dispatch-env
      DISPATCH_REPO: freeCodeCamp/infra
      DISPATCH_WORKFLOW: ansible--housekeeping.yml
      WINDOW_POLICY: require
    deploy:
      <<: *dispatch-deploy
      labels:
        - "swarm.cronjob.enable=true"
        - "swarm.cronjob.replicas=1"
        - "swarm.cronjob.schedule=0 30 1 * * 3,6"
        - "swarm.cronjob.skip-running=true"

  svc-cronjob:
    image: crazymax/swarm-cronjob:1.16.0
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    environment:
      - "TZ=UTC"
      - "LOG_LEVEL=info"
      - "LOG_JSON=true"
    <<: *logging-config
    deploy:
      placement:
        constraints:
          - "node.role == manager"

  svc-update:
    image: shizunge/gantry:2026.0415.1
    environment:
      - "TZ=UTC"
      - "GANTRY_NODE_NAME={{.Node.Hostname}}"
      - "GANTRY_SLEEP_SECONDS=0"
      - "GANTRY_LOG_LEVEL=INFO"
      - "GANTRY_SERVICES_FILTERS=label=org.freecodecamp.autoupdate"
      - "GANTRY_SERVICES_EXCLUDED_FILTERS=name=stg-news"
      - "GANTRY_UPDATE_NUM_WORKERS=3"
      - "GANTRY_MANIFEST_NUM_WORKERS=5"
      - "GANTRY_MANIFEST_CMD=buildx"
      - "GANTRY_CLEANUP_IMAGES=true"
      - "GANTRY_ROLLBACK_ON_FAILURE=true"
      - "GANTRY_UPDATE_TIMEOUT_SECONDS=300"
      - "GANTRY_UPDATE_OPTIONS=--with-registry-auth"
      - "GANTRY_NOTIFICATION_APPRISE_URL=http://svc-apprise:8000/notify"
      - "GANTRY_NOTIFICATION_CONDITION=on-change"
      - "GANTRY_NOTIFICATION_TITLE=· hourly"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/home/freecodecamp/.docker:/root/.docker"
    <<: *logging-config
    deploy:
      mode: replicated
      replicas: 0
      restart_policy:
        condition: none
      labels:
        - "swarm.cronjob.enable=true"
        - "swarm.cronjob.replicas=1"
        # Fire every hour, on the 45th minute mark
        - "swarm.cronjob.schedule=0 45 0/1 * * *"
        # Fire every 1 minute -- for testing
        # - "swarm.cronjob.schedule=* * * * *"
        - "swarm.cronjob.skip-running=true"
      placement:
        constraints:
          - "node.role == manager"

  # Runs as a backup to Gantry's automatic cleanup
  svc-cleanup:
    image: docker:29.5.2
    command:
      - "docker"
      - "system"
      - "prune"
      - "-f"
      - "--filter"
      - "until=168h"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    <<: *logging-config
    deploy:
      mode: global
      labels:
        - "swarm.cronjob.enable=true"
        # Fire every Monday at 03:30 UTC
        - "swarm.cronjob.schedule=0 30 3 * * 1"
        - "swarm.cronjob.skip-running=false"
      restart_policy:
        condition: none

  svc-apprise:
    image: caronc/apprise:1.5.4
    environment:
      - "APPRISE_STATELESS_URLS=${GOOGLE_CHAT_WEBHOOK}"
    <<: *logging-config
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - "node.role == manager"

  svc-webhook:
    image: lwlook/webhook@sha256:93f708c6c0d6469b4a0f7f654d5f25054e54dccba1cf316a1d7e48e2be736c9a
    command:
      - "-verbose"
      - "-hooks=/hooks.json"
      - "-hotreload"
      - "-template"
    ports:
      - published: 9889
        target: 9000
        protocol: tcp
        mode: host
    configs:
      - source: hooks_json
        target: /hooks.json
      - source: run_gantry
        target: /run_gantry.sh
        mode: 0550
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/home/freecodecamp/.docker:/root/.docker"
    environment:
      - "WEBHOOK_SECRET=${WEBHOOK_SECRET}"
    <<: *logging-config
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - "node.role == manager"

configs:
  hooks_json:
    file: ./hooks.json
  run_gantry:
    name: oncall_run_gantry_v2
    file: ./run_gantry.sh
  scripts_lib:
    name: oncall_scripts_lib_v1
    file: ./scripts/lib.sh
  scripts_dispatch:
    name: oncall_scripts_dispatch_v1
    file: ./scripts/dispatch.sh
