services:
  s3:
    build:
      context: ./s3
    volumes:
      - ./fixtures:/fixtures:ro

  caddy:
    build:
      context: ../../../..
      dockerfile: docker/images/caddy-s3/Dockerfile
    depends_on:
      - s3
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
